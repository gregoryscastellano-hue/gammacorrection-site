<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAGA_OF_THE_MONKEY</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #1a0000; /* The Hell Frequency Red */
            color: #ff0000; 
            font-family: 'VT323', monospace; 
            font-size: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .main-title-img {
            max-width: 80%;
            height: auto;
            /* Logo.png glow effect */
            filter: drop-shadow(0 0 15px #ff0000); 
            margin-bottom: 20px;
        }

        .download-box {
            background: #000;
            padding: 25px;
            box-shadow: 0 0 30px #4a0000;
            max-width: 600px;
            border: none; /* No red border as requested */
        }

        .schmeagle-head {
            width: 100px; /* Smaller size for the pathetic protagonist */
            height: auto;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.1s;
        }

        /* Subtle visual feedback when clicking the relic */
        .schmeagle-head:active {
            transform: scale(0.95);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        a { 
            color: #ffffff; 
            text-decoration: underline; 
        }

        a:hover {
            color: #ffff00;
        }
    </style>
</head>
<body>

    <audio id="schmeagle-audio" preload="auto">
        <source src="subway surfahs.mp3" type="audio/mpeg">
    </audio>

    <div class="title-container">
        <img src="logo.png" alt="PENIS MONKEY SAGA" class="main-title-img">
    </div>

    <div class="download-box">
        <img src="schmeagle.png" 
             alt="Schmeagle" 
             class="schmeagle-head" 
             onclick="playSignal()">
        
        <p>FREQUENCY: CRITICAL</p>
        <p>THE FIRST SIGNAL - BRAINROT EPIC</p>
        <br>
        <a href="YOUR_ZIP_LINK_HERE">DOWNLOAD .ZIP (FREEWARE)</a>
        <br><br>
        <a href="index.html" style="font-size: 18px;">-- RETURN TO ARCHIVE --</a>
    </div>

    <script>
        function playSignal() {
            const audio = document.getElementById("schmeagle-audio");
            
            // Reset and play to allow for spam-clicking the brainrot
            audio.currentTime = 0;
            
            audio.play().catch(error => {
                console.error("Signal blocked by browser Order: ", error);
                // Alert helps troubleshoot on mobile/desktop
                alert("The browser is blocking the audio. Click anywhere on the page first!");
            });
        }
    </script>

</body>
</html>
