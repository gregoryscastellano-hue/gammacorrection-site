<!DOCTYPE html>
<html>
<head>
    <title>SAGA_OF_THE_MONKEY</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #1a0000; 
            color: #ff0000; 
            font-family: 'VT323', monospace; 
            font-size: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .main-title-img {
            max-width: 80%;
            height: auto;
            filter: drop-shadow(0 0 15px #ff0000); 
            margin-bottom: 20px;
        }

        .download-box {
            background: #000;
            padding: 25px;
            box-shadow: 0 0 30px #4a0000;
            max-width: 600px;
            border: none;
        }

        .schmeagle-head {
            width: 100px;
            height: auto;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
            cursor: pointer; /* Shows the viewer he can be clicked */
            transition: transform 0.1s;
        }

        /* Makes him 'react' visually when clicked */
        .schmeagle-head:active {
            transform: scale(1.2);
            filter: brightness(1.5);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        a { color: #ffffff; text-decoration: underline; }
        a:hover { color: #ffff00; }
    </style>
</head>
<body>

    <audio id="schmeagle-audio" src="subway surfahs.mp3"></audio>

    <div class="title-container">
        <img src="logo.png" alt="PENIS MONKEY SAGA" class="main-title-img">
    </div>

    <div class="download-box">
        <img src="schmeagle head.png" 
             alt="Schmeagle" 
             class="schmeagle-head" 
             onclick="playSound()">
        
        <p>FREQUENCY: CRITICAL</p>
        <p>THE FIRST SIGNAL - BRAINROT EPIC</p>
        <br>
        <a href="YOUR_ZIP_LINK_HERE">DOWNLOAD .ZIP (FREEWARE)</a>
        <br><br>
        <a href="index.html" style="font-size: 18px;">-- RETURN TO ARCHIVE --</a>
    </div>

    <script>
        function playSound() {
            var audio = document.getElementById("schmeagle-audio");
            audio.currentTime = 0; // Rewinds so you can spam-click him
            audio.play();
        }
    </script>

</body>
</html>
