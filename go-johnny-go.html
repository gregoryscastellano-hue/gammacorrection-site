<!DOCTYPE html>
<html>
<head>
    <title>~ GO, JOHNNY, GO ~</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            color: #ffcc00; 
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.2;
            pointer-events: none;
        }

        /* --- THE SPINNING LOGIC --- */
        @keyframes spinInfinite {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spinning {
            animation: spinInfinite 3s linear infinite !important;
        }

        .main-layout {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 40px;
            z-index: 10;
            padding: 20px;
        }

        #golden-disc {
            width: 450px;
            height: 450px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/b/bd/Voyager_Golden_Record_fx.png');
            background-size: cover;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.2);
            transition: transform 1.5s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
        }

        .audio-deck {
            background: #1a1a1a;
            border: 2px solid #444;
            border-top: 2px solid #666;
            border-left: 2px solid #666;
            padding: 10px;
            width: 200px;
            margin-top: 20px;
            box-shadow: 4px 4px 0px #000;
            text-align: center;
        }

        .nasa-btn {
            background: #333;
            color: #ffcc00;
            border: 2px outset #555;
            font-family: 'VT323', monospace;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .nasa-btn:active { border: 2px inset #222; background: #222; }

        .chapter-box {
            width: 420px;
            height: 550px;
            background: #c0c0c0;
            border: 3px outset #fff;
            color: #000;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 8px 0px #000;
        }

        .win-title {
            background: linear-gradient(90deg, #78350f, #b45309);
            color: white;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: #c0c0c0;
            color: #000;
            border: 2px outset #fff;
            font-family: 'VT323', monospace;
            font-weight: bold;
            font-size: 14px;
            width: 18px;
            height: 16px;
            line-height: 12px;
            cursor: pointer;
            text-align: center;
            padding: 0;
            margin-left: 10px;
        }

        .close-btn:active {
            border: 2px inset #808080;
            background: #a0a0a0;
        }

        .win-content {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            font-size: 14px;
            line-height: 1.6;
            border: 2px inset #808080;
            margin: 5px;
            background: #fff;
        }

        .inscription {
            font-style: italic;
            color: #78350f;
            border-bottom: 1px double #78350f;
            margin-bottom: 15px;
            padding-bottom: 5px;
            font-size: 12px;
            line-height: 1.2;
        }

        #player-ui { position: absolute; left: -9999px; }
    </style>
</head>
<body>

<div id="player-ui"><div id="yt-player"></div></div>

<div class="main-layout">
    <div style="display: flex; flex-direction: column; align-items: center;">
        <div id="golden-disc"></div>

                <button class="close-btn" onclick="window.location.href='index.html'">X</button>

        </div>
        
        <div class="win-content">

            </div>
            <h3 id="chapter-title" style="margin-top:0; color:#78350f; font-family:'VT323'; font-size:24px;"></h3>
            <div id="chapter-body"></div>
        </div>

        <div style="padding:10px; background:#c0c0c0; border-top:1px solid #808080; display: flex; justify-content: space-between;">
            <button class="nasa-btn" onclick="changeChapter(-1)">◄ PREV</button>
            <button class="nasa-btn" onclick="changeChapter(1)">NEXT ►</button>
        </div>
    </div>
</div>

            height: '0', width: '0',
            videoId: 'ELnn9V01EiI',
            playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': 'ELnn9V01EiI' }
        });
    }

    const chapters = [
        {
            title: "Johnny Be Goode",
            body: `<p>In St. Bernard Parish, there is a spot called "The End of the World". It is named that because the Spanish settlers felt it was where dry land civilization ended and the wetlands began. It is deep down in Louisiana close to New Orleans. A young boy sits on the island, dragged here by his father to fish. A golden St. Christopher medal sits resting on his shirt as he draws Luke Skywalker on a piece of paper. He had just seen Star Wars in theaters.</p>
                   <p>"Dad, can I have that bottle?", he asks.</p>
                   <p>His dad doesn't respond, but hands him a glass Dixie Beer bottle.</p>
                   <p>The boy signs his name. Johnny - Age 7. He rolls up the page, which was ripped out of a fishing manual. He slips it into the bottle and throws it into the dead end. The water ripples as the bottle lands in the reeds.</p>
                   <p>"That bottle might end up in the Gulf of Mexico" beams the boy with a grin. His dad lights another cigarette.</p>
                   <p>About 600 miles east from the boy, there is a place called Cape Canaveral. Its name means "place of reeds".</p>
                   <p>The air in the control room is hazy with cigarette smoke as the relays of the computers make a beeping sound, that the boy would compare to R2D2.</p>
                   <p>A bespectacled man, the Public Affairs Officer, says "T-minus 30 seconds and counting. Arming plugs have been pulled."</p>
                   <p>The flight director responds almost liturgically. "All stations, final status check. BOOSTER?"</p>
                   <p>"Go, Flight." the PAO responds in a continuation of the ritual. 
                   <p>"EECOM?"
                   <p> "Go."
                   <p> "GUIDANCE?"
                   <p> "We are Go."
                   <p> "NAV?"
                   <p> "Internal."
                   <p> "We are Go."</p>
                   <p>A blast of orange ignites on the Cape. The smoke is blinding as a small craft is propelled into the sky. A golden record on it gleams as it hits the sun. The JPL control room bursts out in applause and cheer. Papers are thrown into the air. A man in a turtleneck and large dark rimmed glasses wipes away a single tear. He hugs the woman next to him. "The bottle has been cast into the ocean" he whispers.</p>`
        },
        {
            title: "Go, Johnny, Go",
            body: `<p><b>"Way back up in the woods among the evergreens, there stood a log cabin made of earth and wood"</b><br>
                   The Voyager shoots at 38,000 miles per hour through the expanse of space. The pale blue dot is getting imperceptibly smaller.</p>
                   <p><b>"Where lived a country boy named Johnny B. Goode who never ever learned to read or write so well but he could play a guitar just like a-ringin' a bell"</b><br>
                   Johnny is bringing a girl he met in class, Caroline, to the premiere of Return of the Jedi. She is the only girl he has met who doesn't laugh at the idea. He holds her hand as they share from a popcorn bucket.</p>
                   <p><b>"Go, go Go Johnny, go, go Go Johnny, go, go Go Johnny"</b><br>

                   <p><b>"Go, go Go Johnny, go, go Johnny B. Goode"</b><br>
                   If the picture could be zoomed in, you would see Johnny in a hospital, putting his ear over Caroline's pregnant stomach.</p>
                   <p><b>"He used to carry his guitar in a gunny sack, go sit beneath the tree by the railroad track"</b><br>
                   The Voyager is in the Long Dark. Its plutonium heaters have long since died. It is hurtling through a dark void at -455°F.</p>
                   <p><b>"Strumming with the rhythm that the drivers made, the people passing by they would stop and say 'Oh my what that little country boy could play'"</b><br>
                   The child, Johnny Jr, places a lone flower on Johnny's grave and gets in his car.</p>
                   <p><b>"Go, go Go Johnny, go, go Go Johnny, go, go"</b><br>
                   The Voyager is 32 billion miles from home. The concept of the Solar System is a distant memory. The Sun is just a tiny dot far behind it.</p>
                   <p><b>"Go Johnny, go, go Johnny B. Goode"</b><br>
                   Johnny is likewise a distant memory to his great great great grandchildren. His only legacy is a tiny piece of pulp that washes up on the Gulf of Mexico.</p>
                   <p><b>"His mother told him 'someday you will be a man.' And you will be the leader of a big old band Many people coming from miles around"</b><br>
                   The Voyager finally reaches the Oort Cloud. It is stopped dead in its tracks by a beam of blinding light.</p>
                   <p><b>"To hear you play your music when the sun go down Maybe someday your name will be in lights Saying 'Johnny B. Goode tonight'"</b><br>
                   Johnny's great great great great great great great grandson makes the decision to upload his consciousness to an AI simulation so his legacy can live on forever.</p>`
       },
    {
        title: "Roll Over Beethoven",
        body: `<p>A pulsating mass releases a pheromone that would best be translated as "What is it?"</p>
               <p>A second pulsating mass releases a pheromone that would best be translated as "A message. From the Sol system."</p>
               <p>They point their cilia towards the Voyager. They make the equivalent of a gasp, a release of shock pheromones. They can sense the grooves in the disc.</p>
               <p>The second pulsating mass, who in his pheromone tongue is called a name that can best be Latinized as Oqge, says "It's directed at us."</p>
               <p>In the written word of the pulsating masses, they don't use glyphs. They use grooves pressed into the common resource of the GJ 367b system, that being gold.</p>
               <p>The first pulsating mass, best Latinized as Yahb, says "This is why we quarantined them. They are a primitive and war crazed race." He continues scanning the disc with his cilia.</p>
               <p>In linguistics, there is a phenomenon called false cognates. Both the pulsating masses and the humans have independently arrived at the word "Johnny", but it means very different things. In human culture, it is a name or an everyday person. In pulsating mass culture, the vibrations that cause the word Joh'Ni are a holy word, reserved for only the gold discs. It can best be translated as "the unity of the race". G'oh means the severing.</p>
               <p>Yahb releases a scent like scorched earth, the pheromone of Judgment "The quarantine was just. They have taken the vibration of the Unity, the 'Joh-Ni', and they have paired it with the 'G'oh'. They scream for our end on a disc of stolen gold."</p>
               <p>Oqge pulsates in a low somber frequency. "And they sent it into the void like a flare. They are not just primitive; they are loud. They want to be found so they can infect the silence."</p>
               <p>Yahb, directs his cilia to the etched drawing of the Pulsar Map on the cover. "They even provided a map to their nest. They are inviting the 'G'oh' upon themselves."</p>
               <p>Oqge releases a foul pheromone. "Notify the plant."</p>
               <p>Yahb releases a frequency of pure indignation. "Sir with all due respect, he's a defector. He's adopted the culture of the Sol system. He's unreliable."</p>
               <p>Oqge releases a short burst. "Do it."</p>`
    },
        {
            title: "Oh, Hi Mark!",
            body: `<p>Tommy sits at his table tossing a football to himself. He is poring over a script as he listens to R&B music on the radio, a historical artifact to the year 2366. Suddenly, there is a rhythmic beeping sound coming from his bedroom.</p>
                   <p>"Give me second!" he says to no one in particular.</p>
                   <p>He slowly puts the football down and puts the script in a pristine manilla folder.</p>
                   <p>As he walks over to the device provided to him by his race, he is making a conscious effort to retain his (mostly) human appearance. The masses have the ability to shape their form, a vestige of evolution in the harsh GJ ecosystem, but they don't do it much anymore, as it is very painful.</p>
                   <p>He unlocks the biometric scanner hidden under his bed with his pheromone signal, and takes out a strange fleshy device that wiggles around organically.</p>
                   <p>"Who is it?" Tommy releases this pheromone into the device.</p>
                   <p>"You know who it is." Yahb releases. </p>
                   <p>"You haven't called for 1428 Plezi. I feel betrayed." Tommy releases a pheromone of sadness.</p>
                   <p>Yahb pulsates with indignation. "You broke the explicitly stated policy. No influencing human culture. You made our Holy Name synonymous with what they call, bad movies. Movies being the primary way", his pheromones are particularly noxious on the next word, "they express themselves."</p>
                   <p>"I make art" Tommy matter-of-factly releases.</p>
                   <p>"You made blasphemy" Yahb spits.</p>
                   <p>"Whatever. I am getting very tired." Tommy goes to press the fleshy button that hangs up the call.</p>
                   <p>"Do not hang up!" The air on Yahb's spaceship is purple from rage at this point. "An act of war has been declared. You are to exorcise the tumor. Find the work of the previous plant. Because you haven't been doing your job, we have no idea of their defensive capabilities."</p>
                   <p>"I don't want to. I am very tired." Tommy spurts gas from his head.</p>
                   <p>"You are to do it or we will open a black hole over the entire system. The death of billions will be on your hands."</p>
                   <p>Tommy picks up a picture of a spoon on his bedside table. "Tell me what happened."</p>
                   <p>"We have received a message from the creatures. They are planning to sever our race. We are not them. We want to neutralize the threat with the least casualties." Yahb exhales.</p>
                   <p>"I will do it." Tommy spurts. "Very complicated situation."</p>
                   <p>"Good" Yahb says. "The last plant was deployed in what they call Italy. That was Plezis ago. Figure it out."</p>
                   <p>Yahb hangs up.</p>`
        },
        {
            title: "Earth Angel (Will You Be Mine?)",
            body: `<p>Johnny’s x7 great grandson, Mark Sr., sits in the chair as the device is inserted into his skull. His son, Mark, holds his father's wrinkled hand.</p>
                   <p>"Dad, it's okay. You’ll live forever. You’ll see Grandpa." Mark beams into his father's brain, directly sharing the feelings he is experiencing.</p>
                   <p>"It’s not real! It's all bullshit! Hand me my vape!" Mark Sr. beams, giving his son the feeling of disillusionment.</p>
                   <p>"You know it's mandatory. It's better than the alternative." Mark beams the images of Hell™ to his father.</p>
                   <p>The nurse droid comes in. She beams the standard response to Mark.</p>
                   <p>"PLEASE VACATE THE ROOM. THE PROCEDURE MUST BE DONE WITH A UNDISTRACTED MIND."</p>
                   <p>"I love you, Dad." Mark beams along with a tip for the droid.</p>
                   <p>Mark leaves the hospital and gets in his car.</p>
                   <p>"To home" he transmits. He flicks his brain to Music Mode. In the year 2366, music is algorithmically generated for optimal thematic resonance. The AI scanned his sadness about his father as well as the predicted outcome of his future, which unbeknownst to him will heavily involve outer space. Because all music was consolidated under Universal Music Group, which was later bought by Open AI, the AI decided to play a remix of an very vintage song, that being 1954’s Earth Angel. The "remixed" aspect of it is the passivity frequency that Leviathan mandates.</p>
                   <p>Mark sits in his car as it cruises at a steady 90 miles per hour towards his house. He doesn't know this song, but it is optimized to maximally pull on his heart strings. He begins to cry. He gets a pop up ad in his brain that detected his increased cortisol.</p>
                   <p>"HOT BUSTY BITCHES, ENGINEERED FOR YOUR PLEASURE!"</p>
                   <p>The ad displays a stream of content that, if released in the modern day, would result in a shift to a puritanical society. Mark begrudgingly swipes to open it and pays the tribute to the Goddess.</p>
                   <p>By the time he gets to his tenement, he has forgotten his father. The memories have been downscaled to fit the porn. The car parks and he pays a tip.</p>
                   <p>His 333 roommates don't notice his arrival. They are engaged in their own pleasuring on their headsets. Mark opens his sleep pod and gets ready for his shift tomorrow.</p>`
        },
       {
    title: "Sixteen Tons",
    body: `<p>Mark’s Music Mode plays another remixed song to wake him. It detected that he likes the music of the late 1900s.</p>
           
           <p><b>“Some people say a man is made out of mud, a poor man's made out of muscle and blood”</b><br>
           Mark puts on his unitard and puts his hand to the door's biometric scanner. It approves and lets him leave to get in his car.</p>
           
           <p><b>“Muscle and blood and skin and bones, a mind that's weak and a back that's strong”</b><br>
           Mark arrives at the Plant. He sits down and the device inserts itself into his brain.</p>
           
           <p><b>“You load sixteen tons, what do you get? Another day older and deeper in debt”</b><br>
           Mark's brain power begins to contribute to the AGI. This is how he was able to afford the Afterlife™ premium subscription for his father. The AGI requires a lot of processing power, and it was found that the best method was to use existing hardware.</p>
           
           <p><b>“Saint Peter, don't you call me, 'cause I can't go, I owe my soul to the company st-”</b><br>
           The music cuts off to beam a warning to Mark.</p>
           
           <p style="color: #ff0000; font-family: 'VT323'; text-align: center;">“UNAUTHORIZED UNIT SPOTTED NEAR YOUR VICINITY. PLEASE CEASE YOUR DUTIES TEMPORARILY AND AWAIT FURTHER INSTRUCTIONS.”</p>
           
           <p>Mark thinks to himself, “Unauthorized unit? I’ve heard the stories of the Great Reset, but I thought they were just a myth now.” The Dogs begin leaving their pods to inspect the intrusion. Mark’s “coworker” approaches him.</p>
           
           <p>“Oh hi. I was wondering how to get to Italy. It's very far.”</p>
           <p>“Excuse me?” Mark beams. “What's Italy?”</p>
           <p>“It's a very big country. They make pizza. I like half pesto and artichoke.”</p>
           <p>“Listen, we can't talk. We’re under orders to wait for instructions.”</p>
           <p>His “coworker” responds. “Don't worry about that. If you worry too much, it might not come out right.”</p>
           
           <p>Mark is now convinced this “coworker” is somehow related to the warning. He begins to reach for a button.</p>
           <p>“Do not press it. You are crazy.” The “man” slowly reverts to his original form, a pulsating sack of flesh that floats in the air.</p>
           
           <p>Mark faints, but the device is still plugged into his brain and half breaks his fall. The pulsating mass transforms into the form it's comfortable with: a man with pale skin and flowing black hair. He is confused by the device, unplugs it, and puts it in his own brain.</p>
           
           <p>“This is very strange. Ahahaha.”</p>
           
           <p>The machine, not built to process the brain waves of an advanced consciousness, goes into shutdown mode. The Dogs, built for humans and not pulsating masses, completely miss Tommy and go straight for the person associated with the shutdown: Mark.</p>
           
           <p style="color: #ff0000; font-family: 'VT323'; text-align: center;">“UNIT R66, PREPARE FOR JUDGEMENT.”</p>
           <p>“Oh hi Doggy.”</p>`
}
];

    let current = 0;
    let rotation = 0;

    function render() {
        document.getElementById('chapter-title').innerText = chapters[current].title;
        document.getElementById('chapter-body').innerHTML = chapters[current].body;
        
        const trackNum = (current + 1).toString().padStart(2, '0');
        document.getElementById('track-id-display').innerText = `TRACK_${trackNum}`;
        
        rotation += 90;
        const disc = document.getElementById('golden-disc');
        if (!disc.classList.contains('spinning')) {
            disc.style.transform = `rotate(${rotation}deg)`;
        }
    }

    function playAudio() { 
        if(player) player.playVideo(); 
        document.getElementById('status-led').innerText = "SIGNAL_ACTIVE";
        document.getElementById('status-led').style.color = "#00ff00";
        document.getElementById('golden-disc').classList.add('spinning');
    }

    function pauseAudio() { 
        if(player) player.pauseVideo(); 
        document.getElementById('status-led').innerText = "SIGNAL_PAUSED";
        document.getElementById('status-led').style.color = "#ff0000";
        document.getElementById('golden-disc').classList.remove('spinning');
    }

    function changeChapter(dir) {
        current += dir;
        if (current < 0) current = 0;
        if (current >= chapters.length) current = chapters.length - 1;
        render();
        // Reset scroll position to top when changing chapters
        document.querySelector('.win-content').scrollTop = 0;
    }

    window.onload = render;
</script>
</body>
</html>
