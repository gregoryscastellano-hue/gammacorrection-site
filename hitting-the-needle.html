    <style>
        :root {
            --face-width: 620px;
            --face-height: 720px;
            --neon-cyan: #00ffcc;
            --neon-magenta: #ff00ff;
            --face-color: rgba(5, 5, 5, 0.98);
        }

        body {
            background-color: #000;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'VT323', monospace;
            perspective: 1800px;
        }

        .chapter-title {
            position: absolute;
            top: 20px;
            color: var(--neon-magenta);
            font-size: 28px;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--neon-magenta);
            z-index: 10;
        }

        .scene {
            width: var(--face-width);
            height: var(--face-height);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--face-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            backface-visibility: hidden;
            overflow: hidden;
        }

        .face::before {
            content: '';
            position: absolute;
            inset: 0;
            clip-path: polygon(50% 0%, 100% 38%, 81% 100%, 19% 100%, 0% 38%);
            background: var(--neon-cyan);
            z-index: 0;
        }

        .face::after {
            content: '';
            position: absolute;
            inset: 3px;
            clip-path: polygon(50% 0%, 100% 38%, 81% 100%, 19% 100%, 0% 38%);
            background: var(--face-color);
            box-shadow: inset 0 0 60px rgba(0, 255, 204, 0.15);
            z-index: 1;
        }

        .face-content {
            position: relative;
            z-index: 2;
            padding: 170px 80px 60px 80px;
            max-height: 100%;
            overflow-y: auto;
        }

        .face-content p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.7;
            text-align: left;
            margin: 10px 0;
        }

        .face-1 { transform: rotateY(0deg)   translateZ(185px); }
        .face-2 { transform: rotateY(120deg) translateZ(185px); }
        .face-3 { transform: rotateY(240deg) translateZ(185px); }

        .nav-controls {
            margin-top: 30px;
            display: flex;
            gap: 40px;
            z-index: 100;
        }

        button {
            background: #000;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 40px;
            font-family: 'VT323', monospace;
            font-size: 22px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: 0.2s;
            box-shadow: 4px 4px 0px var(--neon-cyan);
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--neon-cyan);
        }

        .archive-link {
            margin-top: 18px;
            font-family: 'VT323', monospace;
            font-size: 14px;
            color: #555;
            text-decoration: none;
            letter-spacing: 2px;
            transition: color 0.3s;
            z-index: 100;
        }

        .archive-link:hover {
            color: var(--neon-magenta);
        }
    </style>
</head>

        function getFaceIndex(pageIndex) {
            return ((pageIndex % 3) + 3) % 3;
        }

        function loadFace(pageIndex) {
            if (pageIndex < 0 || pageIndex >= totalPages) return;
            const faceIdx = getFaceIndex(pageIndex);
            faceContents[faceIdx].innerHTML = pages[pageIndex].html;

            loadFace(currentPage);
            if (currentPage > 0) loadFace(currentPage - 1);
            if (currentPage < totalPages - 1) loadFace(currentPage + 1);
        }

        function updateUI() {
            document.getElementById('chapter-title').textContent = pages[currentPage].chapter;
        }

        function changeFace(direction) {
            const newPage = currentPage + direction;
            if (newPage < 0 || newPage >= totalPages) return;

            currentPage = newPage;
            currentRotation -= (direction * 120);
            die.style.transform = `rotateY(${currentRotation}deg) rotateX(-5deg)`;

            syncFaces();
            updateUI();
        }

        function init() {
            syncFaces();
            updateUI();
        }

        window.onload = init;
    </script>

</body>
</html>
