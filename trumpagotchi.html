<!DOCTYPE html>
<html>
<head>
    <title>~ TRUMPAGOTCHI ~</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            background-image: url('https://64.media.tumblr.com/d9573aea3bf4d7386b42ddd516ea1ce6/147bfebdf112f180-78/s250x400/6895a383d6d2b83a717218a904480bd772fcc875.gif');
            color: #fff;
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .tago-case {
            background: #d4af37;
            border: 6px solid #b8860b;
            border-radius: 40px 40px 60px 60px;
            padding: 30px;
            box-shadow: 10px 10px 0px #000, inset -4px -4px 0px #8b6508;
            width: 300px;
            text-align: center;
            position: relative;
        }
        .brand { font-size: 24px; color: #8b6508; margin-bottom: 10px; text-shadow: 1px 1px #eee; }
        .screen {
            background: #9cad7d;
            border: 8px solid #222;
            height: 250px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 10px;
            image-rendering: pixelated;
        }
        .stats-panel { font-size: 18px; color: #1a1a1a; text-align: left; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .bar-bg { width: 100px; height: 12px; border: 2px solid #1a1a1a; background: rgba(0,0,0,0.1); }
        .bar-fill { height: 100%; background: #1a1a1a; transition: width 0.3s; }
        .sprite-container { flex-grow: 1; position: relative; }
        #trump-sprite {
            width: 100px; image-rendering: pixelated; position: absolute;
            filter: grayscale(1) contrast(1.5); opacity: 0.9;
        }
        #speech-bubble {
            position: absolute; background: #fff; color: #000;
            border: 2px solid #1a1a1a; padding: 3px 7px; font-size: 14px;
            font-family: 'VT323', monospace; display: none; z-index: 5;
            white-space: nowrap; box-shadow: 2px 2px 0px #000; pointer-events: none;
        }
        #status-bubble {
            background: #1a1a1a; color: #9cad7d; padding: 2px 5px;
            position: absolute; bottom: 5px; width: 90%; font-size: 16px;
        }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn {
            background: #c0c0c0; border: 3px outset #fff; padding: 8px; cursor: pointer;
            font-family: 'VT323', monospace; font-weight: bold; box-shadow: 2px 2px 0px #000; font-size: 14px;
        }
        .btn:active { border: 3px inset #fff; transform: translate(1px, 1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        @keyframes shake {
            0%  { transform: translate(2px, 2px); }  20% { transform: translate(-2px, -2px); }
            40% { transform: translate(2px, -2px); } 60% { transform: translate(-2px, 2px); }
            100%{ transform: translate(0, 0); }
        }
        .unstable { animation: shake 0.1s infinite; }

        /* ── YMCA DANCE ── */
        @keyframes ymcaDance {
            0%   { transform: scaleX(1) rotate(0deg) translateY(0); }
            /* Y */
            6%   { transform: scaleX(1) rotate(-12deg) translateY(-8px) scaleY(1.1); }
            12%  { transform: scaleX(1) rotate(12deg) translateY(-8px) scaleY(1.1); }
            18%  { transform: scaleX(1) rotate(0deg) translateY(-12px) scaleY(1.15); }
            /* M */
            25%  { transform: scaleX(1) rotate(0deg) translateY(0); }
            31%  { transform: scaleX(-1) rotate(-15deg) translateY(-4px); }
            37%  { transform: scaleX(1) rotate(15deg) translateY(-4px); }
            43%  { transform: scaleX(-1) rotate(-10deg) translateY(-6px); }
            /* C */
            50%  { transform: scaleX(1) rotate(0deg) translateY(0); }
            56%  { transform: scaleX(1) rotate(20deg) translateY(-5px) scaleX(0.9); }
            62%  { transform: scaleX(1) rotate(15deg) translateY(-8px) scaleX(0.85); }
            /* A */
            69%  { transform: scaleX(1) rotate(0deg) translateY(0); }
            75%  { transform: scaleX(1) rotate(-8deg) translateY(-14px) scaleY(1.12); }
            81%  { transform: scaleX(-1) rotate(8deg) translateY(-14px) scaleY(1.12); }
            87%  { transform: scaleX(1) rotate(0deg) translateY(-16px) scaleY(1.15); }
            /* land */
            94%  { transform: scaleX(1) rotate(0deg) translateY(2px) scaleY(0.92); }
            100% { transform: scaleX(1) rotate(0deg) translateY(0) scaleY(1); }
        }

        .dancing {
            animation: ymcaDance 2.4s ease-in-out forwards !important;
            transform-origin: bottom center !important;
        }

        /* ── GOLF ── */
        #power-meter-container {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 150px; height: 18px; border: 2px solid #1a1a1a;
            background: rgba(0,0,0,0.25); display: none; z-index: 10; overflow: hidden;
        }
        #power-meter-sweet-spot {
            position: absolute; left: 60%; width: 25%; height: 100%;
            background: #4caf50; opacity: 0.75; z-index: 1;
        }
        #power-meter-bar {
            width: 0%; height: 100%; background: #d4af37;
            position: absolute; top: 0; left: 0; z-index: 2;
        }
        #power-meter-label {
            position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
            font-size: 14px; color: #1a1a1a; display: none; z-index: 10; white-space: nowrap;
        }
        .golf-item { position: absolute; image-rendering: pixelated; z-index: 3; }

        /* ── TRUTH SOCIAL ── */
        #truth-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 26, 0.92); z-index: 20;
            display: none; flex-direction: column; padding: 8px;
            box-sizing: border-box; font-family: 'VT323', monospace;
        }
        #truth-overlay.active { display: flex; }
        .truth-header {
            color: #d4af37; font-size: 16px; text-align: center;
            border-bottom: 1px solid #444; padding-bottom: 4px; margin-bottom: 6px;
        }
        #truth-input {
            background: #111; color: #9cad7d; border: 2px inset #555;
            font-family: 'VT323', monospace; font-size: 14px;
            padding: 5px; resize: none; height: 45px; width: 100%;
            box-sizing: border-box; outline: none;
        }
        #truth-input::placeholder { color: #555; }
        .truth-btn-row {
            display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end;
        }
        .truth-btn {
            background: #c0c0c0; border: 2px outset #fff; padding: 3px 10px;
            cursor: pointer; font-family: 'VT323', monospace; font-size: 13px;
        }
        .truth-btn:active { border: 2px inset #fff; }
        .truth-btn.post { background: #d4af37; color: #000; font-weight: bold; }
        #truth-feed {
            flex-grow: 1; overflow-y: auto; margin-top: 6px; font-size: 13px;
        }
        .truth-post {
            background: #1a1a1a; border: 1px solid #333; padding: 5px;
            margin-bottom: 4px; color: #9cad7d;
        }
        .truth-post .handle { color: #d4af37; font-size: 14px; }
        .truth-post .body { color: #ccc; margin: 3px 0; word-break: break-word; }
        .truth-post .metrics { color: #666; font-size: 12px; }
        .truth-post .reply { color: #ff6b6b; margin-top: 3px; font-size: 12px; border-top: 1px solid #333; padding-top: 3px; }
    </style>
</head>
<body>

    <h1 style="color: #ffd700; text-shadow: 3px 3px #ff00ff; margin-bottom: 20px;">TRUMPAGOTCHI v1.0</h1>

    <div class="tago-case">
        <div class="brand">MAGA-TECH</div>
        <div class="screen" id="game-screen">
            <div class="stats-panel">
                <div class="stat-row">EGO:  <div class="bar-bg"><div id="ego-bar"    class="bar-fill"></div></div></div>
                <div class="stat-row">FOOD: <div class="bar-bg"><div id="crave-bar"  class="bar-fill"></div></div></div>
                <div class="stat-row">NRGY: <div class="bar-bg"><div id="energy-bar" class="bar-fill"></div></div></div>
                <div class="stat-row">TEMP: <div class="bar-bg"><div id="temp-bar"   class="bar-fill"></div></div></div>
            </div>
            <div class="sprite-container" id="sprite-container">
                <div id="speech-bubble"></div>
                <img id="trump-sprite" src="trump1.png">
                <div id="power-meter-container">
                    <div id="power-meter-sweet-spot"></div>
                    <div id="power-meter-bar"></div>
                </div>
                <div id="power-meter-label">SWING POWER</div>
            </div>
            <div id="status-bubble">STATUS: STABLE</div>
            <div id="truth-overlay">
                <div class="truth-header">☆ TRUTH SOCIAL ☆</div>
                <textarea id="truth-input" placeholder="What's your truth?" maxlength="120"></textarea>
                <div class="truth-btn-row">
                    <button class="truth-btn" onclick="closeTruth()">CANCEL</button>
                    <button class="truth-btn post" id="truth-post-btn" onclick="postTruth()">POST TRUTH</button>
                </div>
                <div id="truth-feed"></div>
            </div>
        </div>
        <div class="button-grid">
            <button id="btn1" class="btn" onclick="interact('feed')">HAMBERDER</button>
            <button id="btn2" class="btn" onclick="interact('rally')">RALLY</button>
            <button id="btn3" class="btn" onclick="interact('golf')">GOLF</button>
            <button id="btn4" class="btn" onclick="interact('truth')">TRUTH SOCIAL</button>
        </div>
    </div>

    <a href="index.html" style="margin-top: 20px; color: #00FF00; text-decoration: none;">&lt;&lt; BACK TO ARCHIVE</a>

    <script>
        // ═══════════════════════════════
        // GAME STATE
        // ═══════════════════════════════
        let stats = { ego: 100, crave: 80, energy: 100, temper: 0 };

        const phrases = [
            "FAKE NEWS!", "TREMENDOUS!", "SAD!", "YUGE!",
            "MANY SUCH CASES", "WITCH HUNT!", "I WON BY A LOT!",
            "PERFECT CALL!", "NO COLLUSION!", "BELIEVE ME!"
        ];
        let isSpeaking = false;
        let speechTimer = null;

        // ═══════════════════════════════
        // UI ELEMENTS
        // ═══════════════════════════════
        const screenEl        = document.getElementById('game-screen');
        const statusText      = document.getElementById('status-bubble');
        const spriteEl        = document.getElementById('trump-sprite');
        const spriteContainer = document.getElementById('sprite-container');
        const bubbleEl        = document.getElementById('speech-bubble');
        const meterContainer  = document.getElementById('power-meter-container');
        const meterBar        = document.getElementById('power-meter-bar');
        const meterLabel      = document.getElementById('power-meter-label');
        let gameOverTextEl    = null;

        // ═══════════════════════════════
        // MOVEMENT STATE
        // ═══════════════════════════════
        let posX = 0, posY = 0;
        let velX = 0.3, velY = 0.2;
        let targetVelX = 0.3, targetVelY = 0.2;
        let moveStarted = false;
        let waddleAngle = 0;
        let directionTimer = 0;
        let spriteState = 'wandering';
        let foodTarget  = null;
        let foodStuckTimer = 0;

        // ═══════════════════════════════
        // GOLF STATE
        // ═══════════════════════════════
        let powerValue     = 0;
        let powerDirection = 1;
        const POWER_SPEED  = 1.8;
        const SWEET_START  = 60;
        const SWEET_END    = 85;
        let golfBall = null;
        let golfHole = null;

        // ═══════════════════════════════
        // BGM
        // ═══════════════════════════════
        let bgMusicStarted = false;
        const bgMusic = new Audio('ymca1.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.4;
        document.addEventListener('click', () => {
            if (!bgMusicStarted) { bgMusic.play().catch(() => {}); bgMusicStarted = true; }
        }, { once: true });

        // ═══════════════════════════════
        // MOVEMENT
        // ═══════════════════════════════
        function pickNewDirection() {
            const angle = Math.random() * Math.PI * 2;
            const speed = 0.4 + Math.random() * 0.5;
            targetVelX = Math.cos(angle) * speed;
            targetVelY = Math.sin(angle) * speed;
            directionTimer = 90 + Math.floor(Math.random() * 130);
        }

        function eatFood() {
            try { new Audio('munch1.mp3').play(); } catch(e) {}
            stats.crave  = Math.min(100, stats.crave  + 25);
            stats.energy = Math.min(100, stats.energy + 5);
            stats.temper = Math.max(0,   stats.temper - 5);
            updateUI();
            if (foodTarget) { foodTarget.el.remove(); foodTarget = null; }
            foodStuckTimer = 0;
            spriteState = 'wandering';
            document.getElementById('btn1').disabled = false;
            pickNewDirection();
        }

        function updateSpritePosition() {
            if (!moveStarted) {
                const maxX = spriteContainer.offsetWidth  - spriteEl.offsetWidth;
                const maxY = spriteContainer.offsetHeight - spriteEl.offsetHeight;
                posX = maxX / 2; posY = maxY / 2;
                moveStarted = true;
                pickNewDirection();
            }

            const maxX = spriteContainer.offsetWidth  - spriteEl.offsetWidth;
            const maxY = spriteContainer.offsetHeight - spriteEl.offsetHeight;

            if (spriteState === 'wandering') {
                velX += (targetVelX - velX) * 0.03;
                velY += (targetVelY - velY) * 0.03;
                directionTimer--;
                if (directionTimer <= 0) pickNewDirection();
                posX += velX; posY += velY;
                if (posX <= 0 || posX >= maxX) { velX *= -1; targetVelX *= -1; pickNewDirection(); }
                if (posY <= 0 || posY >= maxY) { velY *= -1; targetVelY *= -1; pickNewDirection(); }

            } else if (spriteState === 'seekingFood') {
                foodStuckTimer++;

                // Use closest edge of sprite to food, not center
                const spriteLeft   = posX;
                const spriteRight  = posX + spriteEl.offsetWidth;
                const spriteTop    = posY;
                const spriteBottom = posY + spriteEl.offsetHeight;

                // Closest point on sprite rect to food center
                const closestX = Math.max(spriteLeft, Math.min(foodTarget.x, spriteRight));
                const closestY = Math.max(spriteTop,  Math.min(foodTarget.y, spriteBottom));

                const dx = foodTarget.x - closestX;
                const dy = foodTarget.y - closestY;
                const edgeDist = Math.sqrt(dx * dx + dy * dy);

                // Eat if sprite overlaps or nearly overlaps food
                if (edgeDist < 10 || foodStuckTimer > 300) {
                    eatFood();
                } else {
                    // Steer sprite center toward food
                    const cx = posX + spriteEl.offsetWidth  / 2;
                    const cy = posY + spriteEl.offsetHeight / 2;
                    const toDx = foodTarget.x - cx;
                    const toDy = foodTarget.y - cy;
                    const toDist = Math.sqrt(toDx * toDx + toDy * toDy);
                    if (toDist > 0) {
                        velX = (toDx / toDist) * 1.8;
                        velY = (toDy / toDist) * 1.8;
                    }
                    posX += velX; posY += velY;
                }

            } else if (spriteState === 'golf_aiming' || spriteState === 'golf_swinging') {
                velX = 0; velY = 0;
            } else if (spriteState === 'dancing') {
                velX = 0; velY = 0;
            }

            posX = Math.max(0, Math.min(posX, maxX));
            posY = Math.max(0, Math.min(posY, maxY));

            // Don't override transform during dance — CSS animation handles it
            if (spriteState !== 'dancing') {
                const spd = Math.abs(velX) + Math.abs(velY);
                waddleAngle += spd * 0.06;
                const lean  = Math.sin(waddleAngle) * 8;
                const flipX = velX >= 0 ? 1 : -1;
                spriteEl.style.transform       = `scaleX(${flipX}) rotate(${lean}deg)`;
                spriteEl.style.transformOrigin = 'bottom center';
            }
            spriteEl.style.left = posX + 'px';
            spriteEl.style.top  = posY + 'px';

            if (isSpeaking) {
                bubbleEl.style.left = (posX + spriteEl.offsetWidth / 2 - bubbleEl.offsetWidth / 2) + 'px';
                bubbleEl.style.top  = (posY - 30) + 'px';
            }
        }

        // ═══════════════════════════════
        // MAIN LOOP
        // ═══════════════════════════════
        function animationLoop() {
            if (stats.ego <= 0) return;
            updateSpritePosition();
            if (spriteState === 'golf_aiming') {
                powerValue += powerDirection * POWER_SPEED;
                if (powerValue >= 100) { powerValue = 100; powerDirection = -1; }
                if (powerValue <= 0)   { powerValue = 0;   powerDirection =  1; }
                meterBar.style.width = powerValue + '%';
            }
            requestAnimationFrame(animationLoop);
        }

        // ═══════════════════════════════
        // GOLF MINI-GAME
        // ═══════════════════════════════
        function startGolfGame() {
            spriteState = 'golf_aiming';
            powerValue = 0; powerDirection = 1;

            ['btn1','btn2','btn4'].forEach(id => document.getElementById(id).disabled = true);
            document.getElementById('btn3').innerText = 'SWING!';
            statusText.innerText = 'STATUS: GOLFING...';

            golfBall = document.createElement('img');
            golfBall.src = 'golf_ball.png';
            golfBall.className = 'golf-item';
            golfBall.style.width = '14px';
            golfBall.style.left  = (posX + spriteEl.offsetWidth + 5) + 'px';
            golfBall.style.top   = (posY + spriteEl.offsetHeight - 14) + 'px';
            spriteContainer.appendChild(golfBall);

            golfHole = document.createElement('img');
            golfHole.src = 'golf_hole.png';
            golfHole.className = 'golf-item';
            golfHole.style.width = '24px';
            const holeX = 20 + Math.random() * (spriteContainer.offsetWidth  - 60);
            const holeY = 20 + Math.random() * (spriteContainer.offsetHeight - 80);
            golfHole.style.left = holeX + 'px';
            golfHole.style.top  = holeY + 'px';
            spriteContainer.appendChild(golfHole);

            meterContainer.style.display = 'block';
            meterLabel.style.display     = 'block';
        }

        function executeSwing() {
            if (spriteState !== 'golf_aiming') return;
            spriteState = 'golf_swinging';
            document.getElementById('btn3').disabled = true;
            meterContainer.style.display = 'none';
            meterLabel.style.display     = 'none';

            try { new Audio('golf_swing.mp3').play(); } catch(e) {}

            const isSuccess = powerValue >= SWEET_START && powerValue <= SWEET_END;
            golfBall.style.transition = 'left 0.9s ease-out, top 0.9s ease-out, transform 0.9s ease-out, opacity 0.9s ease-out';

            if (isSuccess) {
                golfBall.style.left      = (parseInt(golfHole.style.left) + 5) + 'px';
                golfBall.style.top       = (parseInt(golfHole.style.top)  + 5) + 'px';
                golfBall.style.transform = 'scale(0.1)';
                golfBall.style.opacity   = '0';
                setTimeout(() => {
                    try { new Audio('golf_hole.mp3').play(); } catch(e) {}
                    statusText.innerText = 'HOLE IN ONE!!';
                    stats.energy = Math.min(100, stats.energy + 50);
                    stats.ego    = Math.min(100, stats.ego    + 20);
                    stats.temper = Math.max(0,   stats.temper - 20);
                    setTimeout(endGolfGame, 1200);
                }, 950);
            } else {
                golfBall.style.left      = (spriteContainer.offsetWidth + 30) + 'px';
                golfBall.style.top       = '-30px';
                golfBall.style.transform = 'scale(0.3)';
                golfBall.style.opacity   = '0';
                setTimeout(() => {
                    statusText.innerText = 'BAD SHOT! SAD!';
                    stats.energy = Math.min(100, stats.energy + 10);
                    stats.temper = Math.min(100, stats.temper + 10);
                    setTimeout(endGolfGame, 1000);
                }, 950);
            }
        }

        function endGolfGame() {
            if (golfBall) { golfBall.remove(); golfBall = null; }
            if (golfHole) { golfHole.remove(); golfHole = null; }
            meterContainer.style.display = 'none';
            meterLabel.style.display     = 'none';
            meterBar.style.width         = '0%';
            spriteState = 'wandering';
            pickNewDirection();
            document.querySelectorAll('.btn').forEach(b => b.disabled = false);
            document.getElementById('btn3').innerText = 'GOLF';
            updateUI();
        }

        // ═══════════════════════════════
        // SPEECH
        // ═══════════════════════════════
        function saySomething() {
            if (stats.ego <= 0 || isSpeaking || spriteState !== 'wandering') return;
            if (Math.random() < 0.30) {
                const phrase = phrases[Math.floor(Math.random() * phrases.length)];
                bubbleEl.innerText = phrase;
                bubbleEl.style.display = 'block';
                isSpeaking = true;
                clearTimeout(speechTimer);
                speechTimer = setTimeout(() => {
                    bubbleEl.style.display = 'none';
                    isSpeaking = false;
                }, 2000);
            }
        }

        // ═══════════════════════════════
        // UPDATE UI
        // ═══════════════════════════════
        function updateUI() {
            document.getElementById('ego-bar').style.width    = stats.ego    + '%';
            document.getElementById('crave-bar').style.width  = stats.crave  + '%';
            document.getElementById('energy-bar').style.width = stats.energy + '%';
            document.getElementById('temp-bar').style.width   = stats.temper + '%';

            const baseFilter = 'grayscale(1) contrast(1.5)';

            if (stats.ego <= 0) {
                if (!gameOverTextEl) {
                    gameOverTextEl = document.createElement('div');
                    gameOverTextEl.innerText = "YOU'RE FIRED!";
                    Object.assign(gameOverTextEl.style, {
                        position: 'absolute', top: '50%', left: '50%',
                        transform: 'translate(-50%, -50%)', fontSize: '48px',
                        color: '#1a1a1a', textShadow: '2px 2px #9cad7d',
                        textAlign: 'center', zIndex: '10'
                    });
                    spriteContainer.appendChild(gameOverTextEl);
                    statusText.innerText  = 'ELECTION RESULTS ARE IN...';
                    spriteEl.style.filter = 'grayscale(1) opacity(0.3)';
                    screenEl.classList.remove('unstable');
                    clearInterval(decayInterval);
                    clearInterval(speechInterval);
                    const labels = ['STOP','THE','COUNT!','RECOUNT!'];
                    document.querySelectorAll('.btn').forEach((b, i) => {
                        b.innerText = labels[i]; b.disabled = true; b.style.opacity = '0.5';
                    });
                }
                return;
            }

            if (stats.temper > 70) {
                statusText.innerText   = 'STATUS: UNSTABLE!';
                screenEl.classList.add('unstable');
                spriteEl.style.filter  = 'sepia(1) hue-rotate(-50deg) saturate(5) contrast(1.2)';
                spriteEl.style.opacity = '1';
            } else if (stats.ego < 30) {
                statusText.innerText   = 'STATUS: SAD!';
                screenEl.classList.remove('unstable');
                spriteEl.style.filter  = baseFilter;
                spriteEl.style.opacity = '0.5';
            } else if (stats.energy < 20) {
                statusText.innerText   = 'STATUS: LOW ENERGY';
                screenEl.classList.remove('unstable');
                spriteEl.style.filter  = `${baseFilter} brightness(0.8)`;
                spriteEl.style.opacity = '0.8';
            } else {
                statusText.innerText   = 'STATUS: STABLE';
                screenEl.classList.remove('unstable');
                spriteEl.style.filter  = baseFilter;
                spriteEl.style.opacity = '0.9';
            }
        }

        // ═══════════════════════════════
        // INTERACTIONS
        // ═══════════════════════════════
        function interact(action) {
            if (stats.ego <= 0) return;

            if (action === 'golf') {
                if (spriteState === 'wandering')   { startGolfGame(); return; }
                if (spriteState === 'golf_aiming') { executeSwing();  return; }
                return;
            }

            if (spriteState !== 'wandering') return;

            if (action === 'feed') {
                spriteState = 'seekingFood';
                foodStuckTimer = 0;
                document.getElementById('btn1').disabled = true;
                const burgerEl = document.createElement('img');
                burgerEl.src = 'burger1.png';
                Object.assign(burgerEl.style, {
                    position: 'absolute', width: '40px', imageRendering: 'pixelated', zIndex: '3'
                });
                // Spawn food in area reachable by sprite center
                const margin = spriteEl.offsetWidth / 2 + 10;
                const foodX = margin + Math.random() * (spriteContainer.offsetWidth  - 40 - margin * 2);
                const foodY = margin + Math.random() * (spriteContainer.offsetHeight - 40 - margin * 2);
                burgerEl.style.left = foodX + 'px';
                burgerEl.style.top  = foodY + 'px';
                spriteContainer.appendChild(burgerEl);
                foodTarget = { el: burgerEl, x: foodX + 20, y: foodY + 20 };
            }

            if (action === 'rally') {
                spriteState = 'dancing';
                document.querySelectorAll('.btn').forEach(b => b.disabled = true);
                statusText.innerText = 'STATUS: RALLY TIME!';

                // Play sound
                try { const s = new Audio('maga.mp3'); s.volume = 0.6; s.play(); } catch(e) {}

                // Clear inline transform and start dance
                spriteEl.style.transform = '';
                spriteEl.classList.add('dancing');

                // Show YMCA speech bubble
                bubbleEl.innerText = '♪ Y.M.C.A! ♪';
                bubbleEl.style.display = 'block';
                bubbleEl.style.left = (posX + spriteEl.offsetWidth / 2 - 40) + 'px';
                bubbleEl.style.top  = (posY - 30) + 'px';
                isSpeaking = true;

                // End dance after animation
                setTimeout(() => {
                    spriteEl.classList.remove('dancing');
                    spriteEl.style.transform = '';
                    bubbleEl.style.display = 'none';
                    isSpeaking = false;
                    spriteState = 'wandering';
                    pickNewDirection();
                    document.querySelectorAll('.btn').forEach(b => b.disabled = false);

                    stats.ego    = 100;
                    stats.energy = Math.max(0,   stats.energy - 40);
                    stats.temper = Math.min(100, stats.temper + 20);
                    updateUI();
                }, 2500);
            }

            if (action === 'truth') {
                openTruth();
            }
        }

        // ═══════════════════════════════
        // TRUTH SOCIAL
        // ═══════════════════════════════
        const truthOverlay = document.getElementById('truth-overlay');
        const truthInput   = document.getElementById('truth-input');
        const truthFeed    = document.getElementById('truth-feed');

        const trumpReplies = {
            positive: [
                "THANK YOU, VERY COOL!", "TREMENDOUS SUPPORTER!", "THIS IS WHAT WINNING LOOKS LIKE!",
                "GREAT PATRIOT! MANY PEOPLE ARE SAYING THIS!", "FINALLY SOMEONE WITH BRAINS!",
                "RETRUTH! EVERYBODY NEEDS TO SEE THIS!", "YOU GET IT! UNLIKE THE FAKE NEWS!"
            ],
            negative: [
                "WRONG! FAKE NEWS!", "SAD! VERY LOW IQ TAKE!", "LOSER! I WON BY A LOT!",
                "ANOTHER HATER! MANY SUCH CASES!", "WITCH HUNT MENTALITY!", "YOU'RE FIRED!",
                "VERY NASTY! THE FAILING TRUTH SOCIAL DOESN'T NEED YOU!"
            ],
            neutral: [
                "INTERESTING... BUT HAVE YOU SEEN MY POLL NUMBERS?",
                "OK BUT DID YOU KNOW I HAD THE BIGGEST INAUGURATION?",
                "NOTED. NOW LET ME TELL YOU ABOUT MY PERFECT CALLS.",
                "MANY PEOPLE ARE TALKING ABOUT THIS. MAYBE. WHO KNOWS!",
                "I'LL LOOK INTO IT. AFTER GOLF."
            ]
        };

        const negativeWords = ['fake','bad','loser','wrong','ugly','stupid','dumb','hate','worst','terrible','sad','weak','boring','small','lost','fail','suck','idiot','fool','liar'];
        const positiveWords = ['great','best','tremendous','huge','yuge','win','beautiful','smart','strong','perfect','amazing','fantastic','incredible','maga','trump','king','god','genius','alpha','based','bigly'];

        function detectSentiment(text) {
            const lower = text.toLowerCase();
            let pos = 0, neg = 0;
            positiveWords.forEach(w => { if (lower.includes(w)) pos++; });
            negativeWords.forEach(w => { if (lower.includes(w)) neg++; });
            if (pos > neg) return 'positive';
            if (neg > pos) return 'negative';
            return 'neutral';
        }

        function openTruth() {
            truthOverlay.classList.add('active');
            truthInput.value = '';
            truthInput.focus();
            document.querySelectorAll('.btn').forEach(b => b.disabled = true);
        }

        function closeTruth() {
            truthOverlay.classList.remove('active');
            document.querySelectorAll('.btn').forEach(b => b.disabled = false);
        }

        function postTruth() {
            const text = truthInput.value.trim();
            if (!text) return;

            const sentiment = detectSentiment(text);
            const replies = trumpReplies[sentiment];
            const reply = replies[Math.floor(Math.random() * replies.length)];

            // Generate fake metrics
            const retruths = Math.floor(Math.random() * 50000) + (sentiment === 'positive' ? 30000 : 500);
            const likes = Math.floor(retruths * (1.5 + Math.random() * 2));
            const formatNum = n => n > 999 ? (n / 1000).toFixed(1) + 'K' : n;

            // Build post HTML
            const postEl = document.createElement('div');
            postEl.className = 'truth-post';
            postEl.innerHTML =
                '<div class="handle">@YOU</div>' +
                '<div class="body">' + text.replace(/</g, '&lt;') + '</div>' +
                '<div class="metrics">♻ ' + formatNum(retruths) + '  ♥ ' + formatNum(likes) + '</div>' +
                '<div class="reply"><span class="handle">@realDonaldTrump</span> ' + reply + '</div>';

            truthFeed.insertBefore(postEl, truthFeed.firstChild);
            truthInput.value = '';

            // Stats based on sentiment
            if (sentiment === 'positive') {
                stats.ego    = Math.min(100, stats.ego + 20);
                stats.temper = Math.max(0,   stats.temper - 5);
            } else if (sentiment === 'negative') {
                stats.ego    = Math.max(0,   stats.ego - 10);
                stats.temper = Math.min(100, stats.temper + 25);
            } else {
                stats.ego    = Math.min(100, stats.ego + 10);
                stats.temper = Math.min(100, stats.temper + 10);
            }
            updateUI();
        }

        // Post on Enter key
        document.getElementById('truth-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); postTruth(); }
        });

        // ═══════════════════════════════
        // GAME LOOPS
        // ═══════════════════════════════
        const decayInterval = setInterval(() => {
            if (stats.ego <= 0) return;
            stats.ego    = Math.max(0,   stats.ego    - 3);
            stats.crave  = Math.max(0,   stats.crave  - 2);
            stats.energy = Math.max(0,   stats.energy - 1);
            if (stats.crave < 20) stats.temper = Math.min(100, stats.temper + 5);
            updateUI();
        }, 3000);

        const speechInterval = setInterval(saySomething, 3000);

        // ═══════════════════════════════
        // INIT
        // ═══════════════════════════════
        updateUI();
        requestAnimationFrame(animationLoop);
    </script>
</body>
</html>
