<!DOCTYPE html>
<html>
<head>
    <title>~ TRUMPAGOTCHI ~</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            background-image: url('https://64.media.tumblr.com/d9573aea3bf4d7386b42ddd516ea1ce6/147bfebdf112f180-78/s250x400/6895a383d6d2b83a717218a904480bd772fcc875.gif');
            color: #fff;
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .tago-case {
            background: #d4af37;
            border: 6px solid #b8860b;
            border-radius: 40px 40px 60px 60px;
            padding: 30px;
            box-shadow: 10px 10px 0px #000, inset -4px -4px 0px #8b6508;
            width: 300px;
            text-align: center;
            position: relative;
        }

        .brand {
            font-size: 24px;
            color: #8b6508;
            margin-bottom: 10px;
            text-shadow: 1px 1px #eee;
        }

        .screen {
            background: #9cad7d;
            border: 8px solid #222;
            height: 250px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 10px;
            image-rendering: pixelated;
        }

        .stats-panel {
            font-size: 18px;
            color: #1a1a1a;
            text-align: left;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .bar-bg {
            width: 100px;
            height: 12px;
            border: 2px solid #1a1a1a;
            background: rgba(0,0,0,0.1);
        }

        .bar-fill {
            height: 100%;
            background: #1a1a1a;
            transition: width 0.3s;
        }

        .sprite-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative; /* This is crucial for positioning the sprite */
        }

        #trump-sprite {
            width: 100px;
            image-rendering: pixelated;
            position: absolute; /* The sprite must be absolutely positioned to move */
            /* This filter makes the sprite look like it's on a green Gameboy screen */
            filter: grayscale(1) contrast(1.5);
            mix-blend-mode: multiply;
            opacity: 0.8;
        }

        #status-bubble {
            background: #1a1a1a;
            color: #9cad7d;
            padding: 2px 5px;
            position: absolute;
            bottom: 5px;
            width: 90%;
            font-size: 16px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            background: #c0c0c0;
            border: 3px outset #fff;
            padding: 8px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-weight: bold;
            box-shadow: 2px 2px 0px #000;
        }

        .btn:active {
            border: 3px inset #fff;
            transform: translate(1px, 1px);
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            20% { transform: translate(-2px, -2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, 2px); }
            100% { transform: translate(0,0); }
        }

        .unstable { animation: shake 0.1s infinite; }
    </style>
</head>
<body>

    <h1 style="color: #ffd700; text-shadow: 3px 3px #ff00ff; margin-bottom: 20px;">TRUMPAGOTCHI v1.0</h1>

    <div class="tago-case">
        <div class="brand">MAGA-TECH</div>
        
        <div class="screen" id="game-screen">
            <div class="stats-panel">
                <div class="stat-row">EGO: <div class="bar-bg"><div id="ego-bar" class="bar-fill"></div></div></div>
                <div class="stat-row">FOOD: <div class="bar-bg"><div id="crave-bar" class="bar-fill"></div></div></div>
                <div class="stat-row">NRGY: <div class="bar-bg"><div id="energy-bar" class="bar-fill"></div></div></div>
                <div class="stat-row">TEMP: <div class="bar-bg"><div id="temp-bar" class="bar-fill"></div></div></div>
            </div>

            <div class="sprite-container">
                <img id="trump-sprite" src="trump1.png">
            </div>
            <div id="status-bubble">STATUS: STABLE</div>
        </div>

       <div class="button-grid">
    <button id="btn1" class="btn" onclick="interact('feed')">HAMBERDER</button>
    <button id="btn2" class="btn" onclick="interact('rally')">RALLY</button>
    <button id="btn3" class="btn" onclick="interact('golf')">GOLF</button>
    <button id="btn4" class="btn" onclick="interact('truth')">TRUTH SOCIAL</button>
</div>

    <a href="index.html" style="margin-top: 20px; color: #00FF00; text-decoration: none;"><< BACK TO ARCHIVE</a>

    <script>
    // --- GAME STATE ---
    let stats = {
        ego: 100,
        crave: 80,
        energy: 100,
        temper: 0
    };

    // --- NEW: SPRITE STATE & TARGETS ---
    let spriteState = 'wandering'; // Can be 'wandering' or 'seekingFood'
    let foodTarget = null; // Will hold the burger element and its coordinates

    // --- UI ELEMENTS ---
    const screenEl = document.getElementById('game-screen');
    const statusText = document.getElementById('status-bubble');
    const spriteEl = document.getElementById('trump-sprite');
    const spriteContainer = document.querySelector('.sprite-container');
    let gameOverTextEl = null;

    // --- MOVEMENT VARIABLES ---
    let posX = 0, posY = 0;
    let velX = 0.3, velY = 0.2;
    let moveStarted = false;
    let waddleAngle = 0;
    let directionTimer = 0;
    let targetVelX = 0.3, targetVelY = 0.2;

    function pickNewDirection() {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.4 + Math.random() * 0.5;
        targetVelX = Math.cos(angle) * speed;
        targetVelY = Math.sin(angle) * speed;
        directionTimer = 90 + Math.floor(Math.random() * 130);
    }

    function moveTrump() {
        if (!moveStarted) {
            const maxX = spriteContainer.offsetWidth - spriteEl.offsetWidth;
            const maxY = spriteContainer.offsetHeight - spriteEl.offsetHeight;
            posX = maxX / 2;
            posY = maxY / 2;
            moveStarted = true;
            pickNewDirection();
        }

        const maxX = spriteContainer.offsetWidth - spriteEl.offsetWidth;
        const maxY = spriteContainer.offsetHeight - spriteEl.offsetHeight;

        // --- NEW: State-based movement ---
        if (spriteState === 'wandering') {
            velX += (targetVelX - velX) * 0.03;
            velY += (targetVelY - velY) * 0.03;
            directionTimer--;
            if (directionTimer <= 0) pickNewDirection();

            posX += velX;
            posY += velY;

            if (posX <= 0 || posX >= maxX) {
                velX *= -1;
                targetVelX *= -1;
                pickNewDirection();
            }
            if (posY <= 0 || posY >= maxY) {
                velY *= -1;
                targetVelY *= -1;
                pickNewDirection();
            }
        } else if (spriteState === 'seekingFood') {
            const spriteCenterX = posX + spriteEl.offsetWidth / 2;
            const spriteCenterY = posY + spriteEl.offsetHeight / 2;
            const targetX = foodTarget.x;
            const targetY = foodTarget.y;

            const dx = targetX - spriteCenterX;
            const dy = targetY - spriteCenterY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // Check if he has reached the burger
            if (distance < 10) {
                // He ate it!
                new Audio('munch1.mp3').play();
                
                // Update stats
                stats.crave = Math.min(100, stats.crave + 25);
                stats.energy = Math.min(100, stats.energy + 5);
                stats.temper = Math.max(0, stats.temper - 5);
                updateUI();

                // Clean up
                foodTarget.el.remove();
                foodTarget = null;
                spriteState = 'wandering';
                document.getElementById('btn1').disabled = false; // Re-enable button
                pickNewDirection(); // Start wandering again

            } else {
                // He's still walking towards it
                const seekSpeed = 1.8;
                velX = (dx / distance) * seekSpeed;
                velY = (dy / distance) * seekSpeed;
                posX += velX;
                posY += velY;
            }
        }

        posX = Math.max(0, Math.min(posX, maxX));
        posY = Math.max(0, Math.min(posY, maxY));

        const currentSpeed = Math.abs(velX) + Math.abs(velY);
        waddleAngle += currentSpeed * 0.06; 
        const waddleLean = Math.sin(waddleAngle) * 8; 
        const facingFlip = velX > 0 ? 1 : -1;

        spriteEl.style.transform = `scaleX(${facingFlip}) rotate(${waddleLean}deg)`;
        spriteEl.style.transformOrigin = 'bottom center';

        spriteEl.style.left = posX + 'px';
        spriteEl.style.top = posY + 'px';

        if (stats.ego > 0) {
           requestAnimationFrame(moveTrump);
        }
    }

    // --- CORE GAME FUNCTIONS ---
    function updateUI() {
        // ... (This function remains the same as the "You're Fired" version)
        // [Copy your previous updateUI function here]
        document.getElementById('ego-bar').style.width = stats.ego + "%";
        document.getElementById('crave-bar').style.width = stats.crave + "%";
        document.getElementById('energy-bar').style.width = stats.energy + "%";
        document.getElementById('temp-bar').style.width = stats.temper + "%";

        const baseFilter = "grayscale(1) contrast(1.5)";

        if (stats.ego <= 0) {
            if (!gameOverTextEl) {
                gameOverTextEl = document.createElement('div');
                gameOverTextEl.innerText = "YOU'RE FIRED!";
                gameOverTextEl.style.position = 'absolute';
                gameOverTextEl.style.top = '50%';
                gameOverTextEl.style.left = '50%';
                gameOverTextEl.style.transform = 'translate(-50%, -50%)';
                gameOverTextEl.style.fontSize = '48px';
                gameOverTextEl.style.color = '#1a1a1a';
                gameOverTextEl.style.textShadow = '2px 2px #9cad7d';
                gameOverTextEl.style.textAlign = 'center';
                gameOverTextEl.style.zIndex = '10';
                spriteContainer.appendChild(gameOverTextEl);

                statusText.innerText = "ELECTION RESULTS ARE IN...";
                spriteEl.style.filter = "grayscale(1) opacity(0.3)";
                
                screenEl.classList.remove('unstable');
                clearInterval(decayInterval); 

                const allButtons = document.querySelectorAll('.btn');
                const newLabels = ["STOP", "THE", "COUNT!", "RECOUNT!"];
                allButtons.forEach((btn, index) => {
                    btn.innerText = newLabels[index] || btn.innerText;
                    btn.disabled = true;
                    btn.style.cursor = 'not-allowed';
                    btn.style.opacity = '0.5';
                });
            }
            return;
        }

        if (stats.temper > 70) {
            statusText.innerText = "STATUS: UNSTABLE!";
            screenEl.classList.add('unstable');
            spriteEl.style.filter = "sepia(1) hue-rotate(-50deg) saturate(5) contrast(1.2)";
            spriteEl.style.mixBlendMode = 'normal';
            spriteEl.style.opacity = '1';
        } else if (stats.ego < 30) {
            statusText.innerText = "STATUS: SAD!";
            screenEl.classList.remove('unstable');
            spriteEl.style.filter = baseFilter;
            spriteEl.style.mixBlendMode = 'multiply';
            spriteEl.style.opacity = '0.5';
        } else if (stats.energy < 20) {
            statusText.innerText = "STATUS: LOW ENERGY";
            screenEl.classList.remove('unstable');
            spriteEl.style.filter = `${baseFilter} brightness(0.8)`;
            spriteEl.style.mixBlendMode = 'multiply';
            spriteEl.style.opacity = '0.8';
        } else {
            statusText.innerText = "STATUS: STABLE";
            screenEl.classList.remove('unstable');
            spriteEl.style.filter = baseFilter;
            spriteEl.style.mixBlendMode = 'normal';
            spriteEl.style.opacity = '0.9';
        }
    }


    function interact(action) {
        if (stats.ego <= 0) return;

        if (action === 'feed') {
            // --- NEW: FEED LOGIC ---
            if (spriteState !== 'wandering') return; // Don't feed if he's busy

            spriteState = 'seekingFood';
            document.getElementById('btn1').disabled = true; // Disable button

            // Create and position the burger
            const burgerEl = document.createElement('img');
            burgerEl.src = 'burger1.png';
            burgerEl.style.position = 'absolute';
            burgerEl.style.width = '40px'; // Adjust size as needed
            burgerEl.style.imageRendering = 'pixelated';
            
            const foodX = Math.random() * (spriteContainer.offsetWidth - 40);
            const foodY = Math.random() * (spriteContainer.offsetHeight - 40);

            burgerEl.style.left = foodX + 'px';
            burgerEl.style.top = foodY + 'px';
            
            spriteContainer.appendChild(burgerEl);

            // Store the target
            foodTarget = {
                el: burgerEl,
                x: foodX,
                y: foodY
            };
            // Note: Stat updates are now handled in moveTrump() when he eats it
        }
        if (action === 'rally') {
            stats.ego = 100;
            stats.energy = Math.max(0, stats.energy - 40);
            stats.temper = Math.min(100, stats.temper + 20);
            updateUI();
        }
        if (action === 'golf') {
            stats.energy = Math.min(100, stats.energy + 50);
            stats.ego = Math.min(100, stats.ego + 10);
            stats.temper = Math.max(0, stats.temper - 20);
            updateUI();
        }
        if (action === 'truth') {
            stats.ego = Math.min(100, stats.ego + 15);
            stats.temper = Math.min(100, stats.temper + 15);
            updateUI();
        }
        // We only call updateUI for immediate actions. 'feed' is now a process.
    }

    // --- GAME LOOP ---
    const decayInterval = setInterval(() => {
        if (stats.ego <= 0) return;

        stats.ego = Math.max(0, stats.ego - 3);
        stats.crave = Math.max(0, stats.crave - 2);
        stats.energy = Math.max(0, stats.energy - 1);
        if (stats.crave < 20) stats.temper = Math.min(100, stats.temper + 5);
        updateUI();
    }, 3000);

    // --- INITIALIZE GAME ---
    updateUI();
    requestAnimationFrame(moveTrump);
</script>
</body>
</html>
