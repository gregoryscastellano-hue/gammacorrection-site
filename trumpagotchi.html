<!DOCTYPE html>
<html>
<head>
    <title>~ TRUMPAGOTCHI ~</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            background-image: url('https://64.media.tumblr.com/d9573aea3bf4d7386b42ddd516ea1ce6/147bfebdf112f180-78/s250x400/6895a383d6d2b83a717218a904480bd772fcc875.gif');
            color: #fff;
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .tago-case {
            background: #d4af37;
            border: 6px solid #b8860b;
            border-radius: 40px 40px 60px 60px;
            padding: 30px;
            box-shadow: 10px 10px 0px #000, inset -4px -4px 0px #8b6508;
            width: 300px;
            text-align: center;
            position: relative;
        }

        .brand {
            font-size: 24px;
            color: #8b6508;
            margin-bottom: 10px;
            text-shadow: 1px 1px #eee;
        }

        .screen {
            background: #9cad7d;
            border: 8px solid #222;
            height: 250px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 10px;
            image-rendering: pixelated;
        }

        .stats-panel {
            font-size: 18px;
            color: #1a1a1a;
            text-align: left;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .bar-bg {
            width: 100px;
            height: 12px;
            border: 2px solid #1a1a1a;
            background: rgba(0,0,0,0.1);
        }

        .bar-fill {
            height: 100%;
            background: #1a1a1a;
            transition: width 0.3s;
        }

        .sprite-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative; /* This is crucial for positioning the sprite */
        }

        #trump-sprite {
            width: 100px;
            image-rendering: pixelated;
            position: absolute; /* The sprite must be absolutely positioned to move */
            /* This filter makes the sprite look like it's on a green Gameboy screen */
            filter: grayscale(1) contrast(1.5);
            mix-blend-mode: multiply;
            opacity: 0.8;
        }

        #status-bubble {
            background: #1a1a1a;
            color: #9cad7d;
            padding: 2px 5px;
            position: absolute;
            bottom: 5px;
            width: 90%;
            font-size: 16px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            background: #c0c0c0;
            border: 3px outset #fff;
            padding: 8px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-weight: bold;
            box-shadow: 2px 2px 0px #000;
        }

        .btn:active {
            border: 3px inset #fff;
            transform: translate(1px, 1px);
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            20% { transform: translate(-2px, -2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, 2px); }
            100% { transform: translate(0,0); }
        }

        .unstable { animation: shake 0.1s infinite; }
    </style>
</head>
<body>

    <h1 style="color: #ffd700; text-shadow: 3px 3px #ff00ff; margin-bottom: 20px;">TRUMPAGOTCHI v1.0</h1>

    <div class="tago-case">
        <div class="brand">MAGA-TECH</div>
        
        <div class="screen" id="game-screen">
            <div class="stats-panel">
                <div class="stat-row">EGO: <div class="bar-bg"><div id="ego-bar" class="bar-fill"></div></div></div>
                <div class="stat-row">FOOD: <div class="bar-bg"><div id="crave-bar" class="bar-fill"></div></div></div>
                <div class="stat-row">NRGY: <div class="bar-bg"><div id="energy-bar" class="bar-fill"></div></div></div>
                <div class="stat-row">TEMP: <div class="bar-bg"><div id="temp-bar" class="bar-fill"></div></div></div>
            </div>

            <div class="sprite-container">
                <img id="trump-sprite" src="trump1.png">
            </div>
            <div id="status-bubble">STATUS: STABLE</div>
        </div>

        <div class="button-grid">
            <button class="btn" onclick="interact('feed')">HAMBERDER</button>
            <button class="btn" onclick="interact('rally')">RALLY</button>
            <button class="btn" onclick="interact('golf')">GOLF</button>
            <button class="btn" onclick="interact('truth')">TRUTH SOCIAL</button>
        </div>
    </div>

    <a href="index.html" style="margin-top: 20px; color: #00FF00; text-decoration: none;"><< BACK TO ARCHIVE</a>

    <script>
        // --- GAME STATE ---
        let stats = {
            ego: 100,
            crave: 80,
            energy: 100,
            temper: 0
        };

        // --- UI ELEMENTS ---
        const screenEl = document.getElementById('game-screen');
        const statusText = document.getElementById('status-bubble');
        const spriteEl = document.getElementById('trump-sprite');
        const spriteContainer = document.querySelector('.sprite-container');

        let posX = 0, posY = 0;
let velX = 0.3, velY = 0.2;
let moveStarted = false;

function moveTrump() {
    if (!moveStarted) {
        // Initialize position from true rendered center, no jump
        const maxX = spriteContainer.offsetWidth - spriteEl.offsetWidth;
        const maxY = spriteContainer.offsetHeight - spriteEl.offsetHeight;
        posX = maxX / 2;
        posY = maxY / 2;
        spriteEl.style.left = posX + 'px';
        spriteEl.style.top = posY + 'px';
        moveStarted = true;
    }

    const maxX = spriteContainer.offsetWidth - spriteEl.offsetWidth;
    const maxY = spriteContainer.offsetHeight - spriteEl.offsetHeight;

    posX += velX;
    posY += velY;

    if (posX <= 0 || posX >= maxX) {
        velX *= -1;
        spriteEl.style.transform = velX > 0 ? 'scaleX(1)' : 'scaleX(-1)';
    }
    if (posY <= 0 || posY >= maxY) velY *= -1;

    posX = Math.max(0, Math.min(posX, maxX));
    posY = Math.max(0, Math.min(posY, maxY));

    spriteEl.style.left = posX + 'px';
    spriteEl.style.top = posY + 'px';

    requestAnimationFrame(moveTrump);
}

        // --- CORE GAME FUNCTIONS ---
        function updateUI() {
            // Update the stat bars
            document.getElementById('ego-bar').style.width = stats.ego + "%";
            document.getElementById('crave-bar').style.width = stats.crave + "%";
            document.getElementById('energy-bar').style.width = stats.energy + "%";
            document.getElementById('temp-bar').style.width = stats.temper + "%";

            // Base filter for the Gameboy screen effect
            const baseFilter = "grayscale(1) contrast(1.5) mix-blend-mode(multiply)";

            // Update status text and visual effects
            if (stats.temper > 70) {
                statusText.innerText = "STATUS: UNSTABLE!";
                screenEl.classList.add('unstable');
                spriteEl.style.filter = "sepia(1) hue-rotate(-50deg) saturate(5) contrast(1.2)"; // "Red" angry effect
            } else if (stats.ego < 30) {
                statusText.innerText = "STATUS: SAD!";
                screenEl.classList.remove('unstable');
                spriteEl.style.filter = `${baseFilter} opacity(0.5)`; // Sad and faded
            } else if (stats.energy < 20) {
                statusText.innerText = "STATUS: LOW ENERGY";
                screenEl.classList.remove('unstable');
                spriteEl.style.filter = `${baseFilter} brightness(0.8)`; // A bit dimmer
            } else {
                statusText.innerText = "STATUS: STABLE";
                screenEl.classList.remove('unstable');
                spriteEl.style.filter = baseFilter; // Normal state
            }

            // Game Over Check
            if (stats.ego <= 0) {
                statusText.innerText = "GAME OVER: DEFEATED";
                spriteEl.style.opacity = "0.2";
                spriteEl.style.filter = "grayscale(1) blur(1px)";
                clearInterval(decayInterval); // Stop the decay timer on game over
            }
        }

        function interact(action) {
            if (stats.ego <= 0) return; // Can't interact if game over

            if (action === 'feed') {
                stats.crave = Math.min(100, stats.crave + 25);
                stats.energy = Math.min(100, stats.energy + 5);
                stats.temper = Math.max(0, stats.temper - 5);
            }
            if (action === 'rally') {
                stats.ego = 100; // Full restore
                stats.energy = Math.max(0, stats.energy - 40);
                stats.temper = Math.min(100, stats.temper + 20);
            }
            if (action === 'golf') {
                stats.energy = Math.min(100, stats.energy + 50);
                stats.ego = Math.min(100, stats.ego + 10);
                stats.temper = Math.max(0, stats.temper - 20);
            }
            if (action === 'truth') {
                stats.ego = Math.min(100, stats.ego + 15);
                stats.temper = Math.min(100, stats.temper + 15);
            }
            updateUI(); // Immediately update UI after an action
        }

        // --- GAME LOOP ---
        const decayInterval = setInterval(() => {
            if (stats.ego <= 0) return; // Stop decay if game is over

            stats.ego = Math.max(0, stats.ego - 3);
            stats.crave = Math.max(0, stats.crave - 2);
            stats.energy = Math.max(0, stats.energy - 1);
            if (stats.crave < 20) stats.temper = Math.min(100, stats.temper + 5);
            updateUI();
        }, 3000);

        // --- INITIALIZE GAME ---
        updateUI();
        moveTrump(); // FIX: Kick off the SINGLE animation loop just once.
    </script>
</body>
</html>
