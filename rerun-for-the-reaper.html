        // --- HEADER EVOLUTION LOGIC ---
        if (currentChapter === 7) { 
            // ENTRY 08: The "Nuclear" Breach
            title.innerText = "Brainrotted BBW Officer Gets Creampied by his Step-Partner";
            title.style.color = "#ff69b4";
        } else if (currentChapter === 8) {
            // ENTRY 09: Back to Normal
            title.innerText = "VIRUELON_CITY_PD_ENCRYPT";
            title.style.color = "#fff";
        } else if (currentChapter === 9) {
            // ENTRY 10: The change begins (S-iruelon)
            title.innerText = "SIRULEON_CITY_PD_ENCRYPT";
            title.style.color = "#fff";
        } else if (currentChapter === 10) {
            // ENTRY 11: Yellow transition
            title.innerText = "SPRIRULEON_CITY_PD_ENCRYPT";
            title.style.color = "#FFD90F"; 
        } else if (currentChapter >= 11) {
            // ENTRY 12+: Full Springfield
            title.innerText = "SPRINGFIELD_PD_ENCRYPT";
            title.style.color = "#FFD90F";
        } else {
            // ENTRIES 01-07: Original Title
            title.innerText = "VIRUELON_CITY_PD_ENCRYPT";
            title.style.color = "#fff";
        }

        // --- VISUAL LOGIC GATES ---
        if (currentChapter >= 5 && currentChapter <= 7) { 
            // THE SLOP TAKEOVER (Entries 06, 07, 08)
            videoOverlay.style.opacity = "0.4";
            document.body.style.backgroundColor = "#000"; 
            container.style.borderColor = "#ffffff";
            container.style.boxShadow = "0 0 40px rgba(255,255,255,0.5)";
            display.style.color = "#ffffff"; // Slop is white text on black
        } else {
            // THE NOIR / RECOVERY (Including the Springfield Chapters)
            videoOverlay.style.opacity = "0";
            document.body.style.backgroundColor = "#0a001a";
            container.style.borderColor = "#7e22ce";
            container.style.boxShadow = "0 0 30px #581c87";
            display.style.color = "#d8b4fe"; // Keep the narration Purple Noir
        }

        // --- UPDATE UI COUNTER ---
        const currentNum = (currentChapter + 1).toString().padStart(2, '0');
        const totalNum = chapters.length.toString().padStart(2, '0');
        statusDisplay.innerHTML = `ENTRY: <span id="chapter-num">${currentNum}</span> / ${totalNum}`;

        document.getElementById('prevBtn').disabled = (currentChapter === 0);
        document.getElementById('nextBtn').disabled = (currentChapter === chapters.length - 1);
        
        display.scrollTop = 0;
    }
    // BOOT UP
    window.onload = renderChapter;
</script>
</body>
</html>
