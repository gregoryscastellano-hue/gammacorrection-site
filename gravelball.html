<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAVELBALL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --nes-bg:     #0000a8;
  --nes-dark:   #000060;
  --nes-black:  #000000;
  --nes-white:  #fcfcfc;
  --nes-yellow: #f8d800;
  --nes-red:    #e40058;
  --nes-cyan:   #00e8d8;
  --nes-green:  #58d854;
  --nes-grey:   #bcbcbc;
  --nes-orange: #f87858;
  --nes-purple: #bc84fc;
  --card-w: 210px;
  --card-h: 305px;
}

html { font-size: 100%; }

.collage {
  position: relative;
  width: 100%;
  height: 100%;
}
.collage img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

html, body {
  width: 100%; height: 100%;
  background: transparent;
  font-family: 'Press Start 2P', monospace;
  color: var(--nes-white);
  overflow: hidden;
}
/* ── YOUTUBE BACKGROUND ── */
#video-bg-container {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: -1; overflow: hidden; pointer-events: none; background: #000;
}
#video-bg-container iframe {
  width: 100vw; height: 56.25vw;
  min-height: 100vh; min-width: 177.77vh;
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(1.3);
  filter: saturate(1.2) contrast(1.1) brightness(0.5);
}

/* ── SCREEN & VHS GLITCH ── */
#screen {
  width: 100vw; height: 100vh;
  background: transparent;
  display: flex; flex-direction: column; align-items: center;
  overflow: hidden; position: relative;
  animation: crtFlicker 9s ease-in-out infinite;
  z-index: 10;
}
#screen::before, #screen::after {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 9999; opacity: 0; background: transparent;
}
#screen::before {
  background: var(--nes-red);
  mix-blend-mode: color-dodge;
  animation: glitch-anim 6s steps(1) infinite;
}
#screen::after {
  background: var(--nes-cyan);
  mix-blend-mode: screen;
  animation: glitch-anim-2 7s steps(1) infinite;
}
@keyframes crtFlicker { 0%,89%,91%,93%,100% { opacity: 1; } 90% { opacity: 0.94; } 92% { opacity: 0.97; }}
@keyframes glitch-anim { 0%,94%{opacity:0;clip-path:inset(0 0 0 0)}95%{opacity:.6;clip-path:inset(20% 0 78% 0)}96%{opacity:.6;clip-path:inset(90% 0 2% 0)}97%{opacity:.6;clip-path:inset(45% 0 53% 0)}98%{opacity:.6;clip-path:inset(10% 0 85% 0)}99%{opacity:.6;clip-path:inset(80% 0 5% 0)}100%{opacity:0} }
@keyframes glitch-anim-2 { 0%,96%{opacity:0;clip-path:inset(0 0 0 0)}97%{opacity:.4;clip-path:inset(85% 0 10% 0)}98%{opacity:.4;clip-path:inset(5% 0 92% 0)}99%{opacity:.4;clip-path:inset(50% 0 45% 0)}100%{opacity:0} }

/* ── VHS SCANLINES ── */
#scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 9000;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12), rgba(0,0,0,0.12) 1px, transparent 1px, transparent 2px);
  background-size: 100% 3px;
}
#scanlines::after {
  content: ""; position: absolute; width: 100%; height: 5px;
  background: rgba(255,255,255,0.2);
  box-shadow: 0 0 15px rgba(255,255,255,0.4);
  opacity: 0.3; top: 0;
  animation: trackingBar 10s linear infinite;
}
@keyframes trackingBar { 0%{top:-5%} 10%{top:110%} 100%{top:110%} }

/* ── VIGNETTE, GLOW & BORDER ── */
#vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 8999;
  background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0,0,0,0.5) 65%, rgba(0,0,0,0.88) 100%);
}
#phosphor {
  position: fixed; inset: 0; pointer-events: none; z-index: 8998;
  background: radial-gradient(ellipse at 50% 50%, rgba(0,60,180,0.08) 0%, transparent 70%);
  animation: phosphorPulse 4s ease-in-out infinite;
}
@keyframes phosphorPulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
#screen::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 8997;
  border: 2px solid rgba(0,120,255,0.15);
  box-shadow: inset 0 0 80px rgba(0,0,180,0.12), inset 0 0 20px rgba(0,0,180,0.08);
}

/* ── HEADER ── */
#header {
  position: relative; z-index: 100; text-align: center;
  padding: 20px 0 8px; pointer-events: none;
}
#header h1 {
  font-size: 22px; color: var(--nes-yellow);
  text-shadow: 3px 3px 0 #8a6000, 0 0 30px rgba(248,216,0,0.5), 0 0 60px rgba(248,216,0,0.2);
  letter-spacing: 5px; animation: titleFlicker 6s ease-in-out infinite;
}
@keyframes titleFlicker { 0%,95%,100%{opacity:1} 96%{opacity:.85} 97%{opacity:1} 98%{opacity:.9} }
#header .sub {
  font-size: 6px; color: var(--nes-cyan); letter-spacing: 2px; margin-top: 8px;
  text-shadow: 0 0 10px rgba(0,232,216,0.6);
}

/* ── HUD — glass ── */
#hud {
  position: relative; z-index: 100; display: flex; gap: 0; margin: 10px 0 6px;
  background: rgba(0,0,20,0.6);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 2px solid var(--nes-white);
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
.hud-cell {
  padding: 7px 14px; border-right: 3px solid var(--nes-white);
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 86px;
}
.hud-cell:last-child { border-right: none; }
.hud-label { font-size: 5px; color: var(--nes-grey); letter-spacing: 1px; }
.hud-val { font-size: 13px; color: var(--nes-yellow); text-shadow: 0 0 8px rgba(248,216,0,0.5); }
.hud-val.momentum-val { color: var(--nes-cyan); text-shadow: 0 0 8px rgba(0,232,216,0.5); }
.hud-val.flicker { animation: hudFlicker 0.4s ease; }
@keyframes hudFlicker { 0%,100%{text-shadow:0 0 8px rgba(248,216,0,.5)} 25%{text-shadow:0 0 20px rgba(248,216,0,1),0 0 40px rgba(248,216,0,.6)} 50%{text-shadow:0 0 4px rgba(248,216,0,.3)} 75%{text-shadow:0 0 16px rgba(248,216,0,.8)} }

/* ── TRAY ── */
#tray {
  position: relative; z-index: 100; display: flex; gap: 6px;
  height: 30px; align-items: center; margin: 4px 0 0;
}
.tray-label { font-size: 6px; color: var(--nes-grey); letter-spacing: 1px; margin-right: 4px; }
.tray-slot {
  width: 22px; height: 22px; border: 2px solid var(--nes-grey);
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  font-size: 7px; color: var(--nes-grey);
}
.tray-slot.filled { border-color: var(--nes-yellow); color: var(--nes-yellow); box-shadow: 0 0 8px rgba(248,216,0,0.4); }
@keyframes slotActivate { 0%{background:rgba(0,0,0,.6);transform:scale(1)} 30%{background:rgba(248,216,0,.3);transform:scale(1.15);color:var(--nes-white)} 100%{background:rgba(0,0,0,.6);transform:scale(1);box-shadow:0 0 8px rgba(248,216,0,.4)} }
.tray-slot.activating { animation: slotActivate 0.3s ease-out; }

/* ── HAND AREA & CARDS ── */
#hand-area {
  position: relative; z-index: 100; flex: 1; width: 100%;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 10px; perspective: 1000px;
}
#hand {
  position: relative; width: 100%; height: 350px;
  display: flex; align-items: flex-end; justify-content: center;
}
.card-wrapper {
  position: absolute; width: var(--card-w); height: var(--card-h);
  cursor: pointer; transform-origin: bottom center;
  transition: bottom 0.3s cubic-bezier(0.34,1.4,0.64,1), transform 0.3s cubic-bezier(0.34,1.4,0.64,1), z-index 0s;
}
.card-wrapper.selected { bottom: 170px !important; z-index: 80 !important; }
.card-wrapper.dealing  { animation: dealIn 0.45s cubic-bezier(0.34,1.4,0.64,1) both; }
@keyframes dealIn { 0%{transform:rotate(0) translateY(60px) scale(.7);opacity:0} 100%{opacity:1} }
.card-wrapper.flying-out { animation: flyOut 0.5s cubic-bezier(0.4,0,1,1) forwards; }
@keyframes flyOut { 0%{transform:scale(1);opacity:1} 60%{transform:scale(1.15) translateY(-30px);opacity:.8} 100%{transform:scale(.3) translateY(-200px) rotate(20deg);opacity:0} }
.card-scene { width: 100%; height: 100%; perspective: 600px; }
.card-3d {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.34,1.2,0.64,1);
  will-change: transform;
}
.card-3d.flipped { transform: rotateY(180deg); }
.card-face, .card-back {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 6px; overflow: hidden;
}
.card-back {
  background: linear-gradient(145deg, #000080, #000040); border: 3px solid #4444cc;
  box-shadow: 0 8px 32px rgba(0,0,0,0.8), 0 0 0 1px rgba(100,100,255,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
}
.card-back-inner {
  position: absolute; inset: 8px; border: 2px solid rgba(100,100,255,0.25);
  background: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(100,100,255,0.05) 5px, rgba(100,100,255,0.05) 10px);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: rgba(100,100,255,0.3); letter-spacing: 2px;
}
.card-back::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(125deg, transparent 0%, rgba(255,255,255,0.03) 30%, rgba(100,180,255,0.08) 50%, rgba(255,100,220,0.04) 70%, transparent 100%);
  border-radius: 4px; pointer-events: none;
}
.card-face {
  background: rgba(10,10,10,0.92);
  border: 3px solid #ffffff;
  transform: rotateY(180deg);
  box-shadow: 0 8px 32px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05), inset 0 1px 0 rgba(255,255,255,0.08);
  display: flex; flex-direction: column; position: relative;
}
.card-face::after {
  content: ''; position: absolute; inset: 0;
  background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAMAAAAp4XiDAAAAUVBMVEWFhYWDg4N3d3dtbW17e3t1dXVpaWl9fX1ZWZnc3Nzi4uKWlpZvb29vbm56enrd3d3FxcVtbW3U1NRaWlqNjY2SkpKenp6bm5trg7vjAAAAAGXRSTlMAQObYZgAAAZNJREFUeJy9llmWgyAMQGsTANAh2yJsggf//19v2tJAEB0r033uYlq1sT7a5lA0QJ6oIv9E3vGZk2s0oeyv2r7Mvz4e2lUNi0UoZWwM1hHPM3f2K3f15k45yoCgvrzQd1flX/5+v0aXHTeRT4e2w2jVwGFp8lPMd6qcruSgZtQih6OA+0K2g5jA1wZpYkYQTJ45Xk6T4DgnltTf759v2/Ayx3k4jANsok2pY25EdHBiXfGfDZSd877sXCAxUsFmBCjWKS8n2d1U4k3I20eZWkJUDaW6c2mWyqj2s9cxpSSkQdeq98+nLmMbLgMJWw8r5brm3CFe4t2SQ+I2jGXb2A21FVs8K3kPKSmG3QxQk28oV1Z/gGgXGwiPA9Lcg4Gac41Bu1EUKp/hE3k7N7YkjrLzCmlkbsD9f4YDrlgdVpCAzJrzAYksQ5CgNBwzM3i1zYQJ6HrvdJpGqP1l3y5MBcPlgG85yQn2P3sychHAQd+904qN5x3wUfJ2f/s5I8Udolv6Wk2Y3LzFSgO0HyjP0D1rXv1c+PFTwNmuS817j10n62JkY58dshlSBHkM1lZ2u4MW34y+xG7s8Q3o+s4gI+/s/7gZ3daQHPDRj22VzE/uNvVBTfMv7vydy8iA3AI/S2k71l/rS2T44ppj347pviIZ/AjvN3iC5jJ2xL/x/wD/u/gA7zCgIuMAcMIAAAAASUVORK5CYII=');
  opacity: 0.04; pointer-events: none; z-index: 4;
}
.card-face.sel-glow {
  border-color: var(--nes-yellow);
  animation: breatheGlow 2s ease-in-out infinite;
}
@keyframes breatheGlow { 0%,100%{box-shadow:0 0 0 2px var(--nes-yellow),0 0 14px rgba(248,216,0,.4),0 0 30px rgba(248,216,0,.15),0 8px 32px rgba(0,0,0,.8)} 50%{box-shadow:0 0 0 2px var(--nes-yellow),0 0 28px rgba(248,216,0,.8),0 0 55px rgba(248,216,0,.35),0 8px 32px rgba(0,0,0,.8)} }
.card-sheen {
  position: absolute; inset: 0; border-radius: 3px; pointer-events: none;
  z-index: 50; opacity: 0; transition: opacity 0.15s; mix-blend-mode: screen;
}
.card-type-bar { height: 7px; width: 100%; flex-shrink: 0; }
.type-driver { background: var(--nes-red);    box-shadow: 0 0 8px rgba(228,0,88,0.6); }
.type-golem  { background: var(--nes-orange); box-shadow: 0 0 8px rgba(248,120,88,0.6); }
.type-toad   { background: var(--nes-green);  box-shadow: 0 0 8px rgba(88,216,84,0.6); }
.card-art {
  flex: 0 0 120px; background: #141414;
  display: flex; align-items: center; justify-content: center;
  position: relative; border-bottom: 2px solid #222; overflow: hidden;
}
.card-art::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.15) 3px, rgba(0,0,0,0.15) 4px);
}
.pixel-placeholder {
  width: 88px; height: 88px; display: grid;
  grid-template-columns: repeat(8, 11px); grid-template-rows: repeat(8, 11px);
  image-rendering: pixelated; position: relative; z-index: 1;
  transition: transform 0.08s ease;
  animation: spriteBob 3s ease-in-out infinite;
}
@keyframes spriteBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
.px { width: 11px; height: 11px; }
.card-type-tag {
  position: absolute; bottom: 3px; right: 4px; font-size: 6px;
  color: rgba(255,255,255,0.4); letter-spacing: 1px;
  background: rgba(0,0,0,0.8); padding: 1px 3px; z-index: 3;
}
.card-name-area {
  padding: 6px 6px 4px; border-bottom: 2px solid #333;
  background: linear-gradient(180deg, #181818 0%, #080808 100%);
  position: relative;
}
.card-name-area::before {
  content: ''; position: absolute; top: 2px; left: 3px; width: 4px; height: 4px;
  background: #555; border-radius: 50%;
  box-shadow: 196px 0 0 #555, 196px 20px 0 #555, 0 20px 0 #555;
}
.card-name {
  font-size: 8px; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 0 6px rgba(255,255,255,0.3);
}
.card-nickname {
  font-size: 7px; color: var(--nes-cyan); margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 0 6px rgba(0,232,216,0.4);
}
.card-stats {
  flex: 1; padding: 4px 5px; background: #070707;
  display: flex; flex-direction: column; gap: 3px;
}
.stat-row { display: flex; align-items: center; gap: 3px; }
.stat-letter { font-size: 8px; width: 13px; flex-shrink: 0; text-shadow: 0 0 6px currentColor; }
.stat-bar-bg { flex: 1; height: 6px; background: #1a1a1a; border: 1px solid #2a2a2a; overflow: hidden; }
.stat-bar-fill { height: 100%; image-rendering: pixelated; box-shadow: 1px 0 4px currentColor; }
.stat-num { font-size: 8px; min-width: 22px; text-align: right; color: #ccc; }

/* ── STAMINA PIPS ── */
.stamina-bar {
  position: absolute; top: 4px; left: 4px; z-index: 10;
  display: flex; gap: 2px;
}
.stamina-pip {
  width: 6px; height: 6px; border: 1px solid rgba(88,216,84,0.6);
  background: var(--nes-green); image-rendering: pixelated;
}
.stamina-pip.spent { background: #222; border-color: #444; opacity: 0.5; }
.stamina-pip.danger { background: var(--nes-red); border-color: rgba(228,0,88,0.6); animation: pipWarn 0.8s infinite; }
@keyframes pipWarn { 0%,100%{opacity:1} 50%{opacity:0.3} }
.card-wrapper.exhausted { opacity: 0.3; pointer-events: none; filter: grayscale(0.8); }

/* ── BOTTOM BAR ── */
#bottom-bar {
  position: relative; z-index: 100; display: flex; gap: 16px;
  padding: 8px 0 16px; align-items: center;
}
.nes-btn {
  font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 9px 18px;
  border: 0; cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
  position: relative; top: 0; transition: top 0.05s, box-shadow 0.05s, transform 0.1s;
}
.nes-btn:hover:not(:disabled) {
  transform: scale(1.05) rotate(-1deg);
  transition: top 0.05s, box-shadow 0.05s, transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
}
.nes-btn:active { top: 3px; transform: scale(1) rotate(0deg); }
.nes-btn-yellow {
  background: var(--nes-yellow); color: #000;
  box-shadow: 0 4px 0 #8a6000, 4px 4px 0 #000, 0 0 20px rgba(248,216,0,0.3);
}
.nes-btn-yellow:hover  { background: #ffe840; box-shadow: 0 4px 0 #8a6000, 4px 4px 0 #000, 0 0 30px rgba(248,216,0,0.5); }
.nes-btn-yellow:disabled { background: #555; color: #333; box-shadow: 0 4px 0 #222, 4px 4px 0 #000; cursor: not-allowed; }
.nes-btn-grey {
  background: var(--nes-grey); color: #000; font-size: 7px;
  box-shadow: 0 4px 0 #555, 4px 4px 0 #000;
}
.nes-btn-grey:hover { background: #ddd; }
.nes-btn-cyan {
  background: var(--nes-cyan); color: #000; font-size: 7px;
  box-shadow: 0 4px 0 #007a72, 4px 4px 0 #000, 0 0 16px rgba(0,232,216,0.3);
}
.nes-btn-cyan:hover { background: #40fce8; box-shadow: 0 4px 0 #007a72, 4px 4px 0 #000, 0 0 24px rgba(0,232,216,0.5); }
.nes-btn-cyan:disabled { background: #446; color: #223; box-shadow: 0 4px 0 #222, 4px 4px 0 #000; cursor: not-allowed; }

/* ── SCORE POPUP & FX ── */
#score-popup { position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%); font-size: 22px; color: var(--nes-yellow); text-shadow: 3px 3px 0 #8a6000, 0 0 40px rgba(248,216,0,0.8); pointer-events: none; opacity: 0; z-index: 200; text-align: center; letter-spacing: 2px; line-height: 1.8; white-space: pre; }
#score-popup.pop { animation: nesPop 1.6s ease forwards; }
@keyframes nesPop { 0%{opacity:0;transform:translate(-50%,-50%) scale(.4)} 15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)} 70%{opacity:1;transform:translate(-50%,-65%) scale(1)} 100%{opacity:0;transform:translate(-50%,-85%) scale(.9)} }
#foul-flash { position:fixed; inset:0; pointer-events:none; z-index:8990; opacity:0; }
#foul-flash.flash { animation: nesFlash 0.45s ease forwards; }
@keyframes nesFlash { 0%,100%{background:0 0;opacity:0} 30%,70%{background:var(--nes-red);opacity:.3} }
#toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.9); border:3px solid var(--nes-white); padding:8px 18px; font-size:7px; color:#fff; letter-spacing:1px; opacity:0; pointer-events:none; z-index:400; white-space:nowrap; box-shadow:4px 4px 0 #000, 0 0 20px rgba(255,255,255,0.1); transition:opacity 0.1s; }
#toast.show { opacity:1; }
#toast.foul { border-color:var(--nes-red); color:var(--nes-red); box-shadow:4px 4px 0 #000, 0 0 20px rgba(228,0,88,0.4); }
#toast.good { border-color:var(--nes-yellow); color:var(--nes-yellow); box-shadow:4px 4px 0 #000, 0 0 20px rgba(248,216,0,0.4); }
#toast.momentum { border-color:var(--nes-cyan); color:var(--nes-cyan); box-shadow:4px 4px 0 #000, 0 0 20px rgba(0,232,216,0.4); }
.particle { position:fixed; border-radius:0; pointer-events:none; z-index:150; animation:pfly 0.9s ease-out forwards; image-rendering:pixelated; }
@keyframes pfly { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)} }

/* ── JLORP MADDOX ADVISOR ── */
#maddox-advisor {
  position: fixed; bottom: -10px; right: 30px;
  z-index: 9999; cursor: pointer; user-select: none; -webkit-user-select: none;
}
#maddox-sprite {
  width: 320px; height: 320px; image-rendering: pixelated;
  transform-origin: bottom center; display: block;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#maddox-advisor:hover #maddox-sprite { transform: scale(1.05) rotate(-2deg); }
#maddox-speech-bubble {
  position: absolute; bottom: 310px; right: 0; width: 300px;
  padding: 12px 18px; background: rgba(0,0,0,0.9);
  border: 3px solid var(--nes-cyan); box-shadow: -4px 4px 0 #000;
  font-size: 7px; line-height: 1.8; letter-spacing: 1px;
  color: var(--nes-cyan); text-shadow: 0 0 6px rgba(0,232,216,0.4);
  opacity: 0; transform-origin: bottom right; transform: scale(0.8);
  pointer-events: none; transition: opacity 0.2s, transform 0.2s;
}

<script>
// ═══════════════════════════════════════
// WEB AUDIO SFX
// ═══════════════════════════════════════
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function sfx(type) {
  try {
    const ac = getAudioCtx();
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    const t = ac.currentTime;
    if (type === 'select') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, t); osc.frequency.exponentialRampToValueAtTime(880, t+0.08);
      gain.gain.setValueAtTime(0.12, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.15);
      osc.start(t); osc.stop(t+0.15);
    } else if (type === 'deselect') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(880, t); osc.frequency.exponentialRampToValueAtTime(220, t+0.1);
      gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.12);
      osc.start(t); osc.stop(t+0.12);
    } else if (type === 'denied') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, t); osc.frequency.setValueAtTime(100, t+0.06); osc.frequency.setValueAtTime(80, t+0.12);
      gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.18);
      osc.start(t); osc.stop(t+0.18);
    } else if (type === 'play') {
      [261,329,392,523].forEach((freq,i) => {
        const o2=ac.createOscillator(), g2=ac.createGain();
        o2.connect(g2); g2.connect(ac.destination); o2.type='square'; o2.frequency.value=freq;
        g2.gain.setValueAtTime(0.10, t+i*0.06); g2.gain.exponentialRampToValueAtTime(0.001, t+i*0.06+0.12);
        o2.start(t+i*0.06); o2.stop(t+i*0.06+0.14);
      }); return;
    } else if (type === 'foul') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(60, t+0.3);
      gain.gain.setValueAtTime(0.18, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.3);
      osc.start(t); osc.stop(t+0.3);
    } else if (type === 'draw') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(523, t); osc.frequency.exponentialRampToValueAtTime(784, t+0.1);
      gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.15);
      osc.start(t); osc.stop(t+0.15);
    } else if (type === 'exhaust') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(80, t+0.25);
      gain.gain.setValueAtTime(0.12, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.25);
      osc.start(t); osc.stop(t+0.25);
    } else if (type === 'maddox') {
      osc.disconnect(); gain.disconnect();
      const freq = 100 + Math.random() * 60;
      const formants = [{f:freq,g:0.18},{f:freq*2.1,g:0.10},{f:freq*3.4,g:0.06},{f:freq*5.0,g:0.03}];
      formants.forEach(({ f, g }) => {
        const o = ac.createOscillator(), gn = ac.createGain(), filter = ac.createBiquadFilter();
        filter.type='bandpass'; filter.frequency.value=f; filter.Q.value=8;
        o.type='sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*0.88,t+0.14);
        gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(g,t+0.02); gn.gain.exponentialRampToValueAtTime(0.001,t+0.16);
        o.connect(filter); filter.connect(gn); gn.connect(ac.destination);
        o.start(t); o.stop(t+0.18);
      }); return;
    }
  } catch(e) {}
}

// ═══════════════════════════════════════
// BGM
// ═══════════════════════════════════════
let audioStarted = false, muted = false;
function startAudio() {
  if (audioStarted) return;
  const bgm = document.getElementById('bgm');
  if (!bgm) return;
  bgm.volume = 0;
  bgm.play().then(() => {
    audioStarted = true;
    let v = 0;
    const fade = setInterval(() => { v = Math.min(0.45, v+0.02); bgm.volume = v; if (v >= 0.45) clearInterval(fade); }, 80);
  }).catch(() => {});
}
function toggleMute() {
  const bgm = document.getElementById('bgm'), btn = document.getElementById('btn-mute');
  muted = !muted; if (bgm) bgm.muted = muted;
  btn.textContent = muted ? '♪ OFF' : '♪ ON';
}
document.addEventListener('click', startAudio, { once: true });
document.addEventListener('keydown', startAudio, { once: true });

// ═══════════════════════════════════════
// MARKOV NAMES
// ═══════════════════════════════════════
const SEED_NAMES = ["SLEVE MCDICHAEL","ONSON SWEEMEY","DARRYL ARCHIDELD","ANATOLI SMORIN","REY MCSRIFF","GLENALLEN MIXON","MARIO MCRLWAIN","RAUL CHAMGERLAIN","KEVIN NOGILNY","TONY SMEHRIK","BOBSON DUGNUTT","WILLIE DUSTICE","JEROMY GRIDE","SCOTT DOURQUE","SHOWN FURCOTTE","DEAN WESREY","MIKE TRUK","DWIGT RORTUGAL","TIM SANDAELE","KARL DANDLETON","MIKE SERNANDEZ","TODD BONZALEZ","CARL BRENTON","DALE HORWICK","LEON STRAMBLE","FRANK DUVANE","GARY MULSTON","PETE CORWELL","WADE JARMON","BOYD KELLNER","HANK DILLMORE","ROY CANTRELL","GLEN FOSTWICK","VERN ASHMORE","BURL TRENTHAM","CLEM HARWOOD","OTTO WEXFORD","LARS DRUMMOND","REED HOLSTEN","WARD MCALTON","CLAY BURNETT","ROSS ELFORD","DIRK SWANHOLM","NELS CORRIGAN","FORD BLAXTON","DREW HALCOMBE"];
function buildChain(words){const c={};for(const w of words){const s='^'+w+'$';for(let i=0;i<s.length-1;i++){if(!c[s[i]])c[s[i]]=[];c[s[i]].push(s[i+1])}}return c}
function genFromChain(chain,min,max){for(let t=0;t<50;t++){let r='',cur='^';for(let i=0;i<18;i++){const nx=chain[cur];if(!nx)break;cur=nx[Math.floor(Math.random()*nx.length)];if(cur==='$')break;r+=cur}if(r.length>=min&&r.length<=max)return r}return['DORN','BLECK','WAVEN','TROB','GLUF'][Math.floor(Math.random()*5)]}
const firstChain=buildChain(SEED_NAMES.map(n=>n.split(' ')[0]));
const lastChain=buildChain(SEED_NAMES.map(n=>n.split(' ').slice(1).join(' ')));
const NICKNAMES=['"The Foreman"','"Dustcloud"','"Two-Shovel"','"Quarter-inch"','"The Slab"','"Plumb"','"Gravel King"','"The Frog"','"Backhoe"','"Tremor"','"Tonnage"','"Deep-Site"','"Seismic"','"No-Dust"','"The Feed"'];
function markovName(){return{first:genFromChain(firstChain,3,8),last:genFromChain(lastChain,3,10),get full(){return this.first+' '+this.last}}}

// ═══════════════════════════════════════
// STATS & ART
// ═══════════════════════════════════════
const STATS=[{key:'G',color:'#e40058',label:'GRIP'},{key:'A',color:'#4a90d9',label:'ALIGN'},{key:'H',color:'#f8d800',label:'HUMOR'},{key:'M',color:'#58d854',label:'METAB'},{key:'B',color:'#bc84fc',label:'BALANC'}];
const GITHUB = 'https://raw.githubusercontent.com/gregoryscastellano-hue/gammacorrection-site/main/';
const ASSETS = {
  bodies: ['body1.png','body2.png','body3.png','body4.png','body5.png','body6.png','body7.png','body8.png'],
  faces:  ['face1.png','face2.png','face3.png','face4.png','face5.png','face6.png','face7.png','face8.png'],
  eyes:   ['eyes1.png','eyes2.png','eyes3.png','eyes4.png','eyes5.png','eyes6.png','eyes7.png','eyes8.png'],
  noses:  ['nose1.png','nose2.png','nose3.png','nose4.png','nose5.png','nose6.png','nose7.png','nose8.png'],
  mouths: ['mouth1.png','mouth2.png','mouth3.png','mouth4.png','mouth5.png','mouth6.png','mouth7.png','mouth8.png']
};
function buildCollage(card) {
  return `<img src="${card.appearance.body}" style="z-index:1;"><img src="${card.appearance.face}" style="z-index:2;"><img src="${card.appearance.eyes}" style="z-index:3;"><img src="${card.appearance.noses}" style="z-index:4;"><img src="${card.appearance.mouth}" style="z-index:5;">`;
}

// ═══════════════════════════════════════
// CARD GENERATION & STATE
// ═══════════════════════════════════════
const TYPES=['driver','driver','driver','golem','toad'];
function rollStat(type){const base=type==='golem'?42:type==='toad'?18:32;let v=base+Math.floor(Math.random()*(type==='golem'?42:type==='toad'?52:58));if(Math.random()<0.09)v=Math.min(99,v+Math.floor(Math.random()*22));return Math.min(99,Math.max(1,v))}

function generateCard() {
  const type = TYPES[Math.floor(Math.random() * TYPES.length)];
  const name = markovName();
  const nick = NICKNAMES[Math.floor(Math.random() * NICKNAMES.length)];
  const stats = {};
  STATS.forEach(s => { stats[s.key] = rollStat(type) });
  if (type === 'toad') {
    const b = STATS[Math.floor(Math.random() * STATS.length)].key;
    stats[b] = Math.min(99, stats[b] + 28);
  }
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const appearance = {
    body: GITHUB + pick(ASSETS.bodies), face: GITHUB + pick(ASSETS.faces),
    eyes: GITHUB + pick(ASSETS.eyes), noses: GITHUB + pick(ASSETS.noses),
    mouth: GITHUB + pick(ASSETS.mouths)
  };
  // M stat determines stamina: how many plays before exhaustion
  const stamina = Math.floor(stats['M'] / 20) + 2; // range 2-6
  return { id: Math.random().toString(36).slice(2), name, nick, type, stats, appearance, stamina, age: 0 };
}

let hand=[], selected=[], score=0, round=1, target=50, momentum=0;
const DRAW_COST = 5;

// ═══════════════════════════════════════
// DEAL & RENDER
// ═══════════════════════════════════════
function dealHand(){selected=[];hand=Array.from({length:7},generateCard);renderHand(true);updateHUD();document.getElementById('btn-play').disabled=true}

function renderHand(animate){
  const el=document.getElementById('hand');el.innerHTML='';const n=hand.length;
  hand.forEach((card,i)=>{
    const mid=(n-1)/2, gap=Math.min(58,400/n);
    const offset=(i-mid)*gap, rot=(i-mid)*3.5, lift=Math.abs(i-mid)*4;
    const isSel=selected.includes(i), cw=210;
    const isExhausted = card.age >= card.stamina;

    const wrap=document.createElement('div');
    wrap.className='card-wrapper'+(isSel?' selected':'')+(animate?' dealing':'')+(isExhausted?' exhausted':'');
    wrap.id='card-'+i; wrap.dataset.index=i;
    wrap.style.cssText=`left:calc(50% + ${offset}px - ${cw/2}px);bottom:${isSel?170:-lift}px;transform:rotate(${isSel?0:rot}deg);z-index:${isSel?80:20-Math.abs(i-mid)};animation-delay:${animate?i*0.07:0}s;`;

    // Stamina pips
    let pipsHTML = '<div class="stamina-bar">';
    for (let p = 0; p < card.stamina; p++) {
      const remaining = card.stamina - card.age;
      if (p < remaining) {
        pipsHTML += `<div class="stamina-pip${remaining === 1 ? ' danger' : ''}"></div>`;
      } else {
        pipsHTML += '<div class="stamina-pip spent"></div>';
      }
    }
    pipsHTML += '</div>';

    const statsHTML=STATS.map(s=>{const val=card.stats[s.key];return`<div class="stat-row"><span class="stat-letter" style="color:${s.color}">${s.key}</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${val}%;background:${s.color}"></div></div><span class="stat-num">${String(val).padStart(2,'0')}</span></div>`}).join('');

    wrap.innerHTML=`<div class="card-scene"><div class="card-3d" id="c3d-${i}"><div class="card-back"><div class="card-back-inner">GB</div></div><div class="card-face${isSel?' sel-glow':''}"><div class="card-sheen" id="sheen-${i}"></div>${pipsHTML}<div class="card-type-bar type-${card.type}"></div><div class="card-art" id="art-${i}"><div class="collage" id="sprite-${i}">${buildCollage(card)}</div><div class="card-type-tag">${card.type.toUpperCase()}</div></div><div class="card-name-area"><div class="card-name">${card.name.full}</div><div class="card-nickname">${card.nick}</div></div><div class="card-stats">${statsHTML}</div></div></div></div>`;

    if (!isExhausted) {
      wrap.addEventListener('mousemove',e=>tiltCard(i,e,wrap));
      wrap.addEventListener('mouseleave',()=>resetTilt(i));
      wrap.addEventListener('mouseenter',()=>{if(!selected.includes(i)){wrap.style.bottom=(parseInt(wrap.style.bottom)||0)+20+'px';wrap.style.zIndex=60}});
      wrap.addEventListener('mouseleave',()=>{if(!selected.includes(i)){wrap.style.bottom=-lift+'px';wrap.style.zIndex=20-Math.abs(i-mid)}});
      wrap.addEventListener('click',()=>toggleSelect(i));
    }

    const c3d=wrap.querySelector('.card-3d');
    if(animate){setTimeout(()=>c3d.classList.add('flipped'),200+i*110)}else{c3d.classList.add('flipped')}
    el.appendChild(wrap);
  });
}

// ═══════════════════════════════════════
// 3D TILT + ART PARALLAX
// ═══════════════════════════════════════
function tiltCard(i,e,wrap){const c3d=document.getElementById('c3d-'+i),sheen=document.getElementById('sheen-'+i),sprite=document.getElementById('sprite-'+i);if(!c3d)return;const rect=wrap.getBoundingClientRect();const dx=(e.clientX-(rect.left+rect.width/2))/(rect.width/2);const dy=(e.clientY-(rect.top+rect.height/2))/(rect.height/2);const rotX=-dy*12,rotY=dx*12,rotZ=dx*6;const isSel=selected.includes(i);if(isSel){c3d.style.transform=`rotateY(180deg) rotateX(${rotX}deg) rotateY(${rotY}deg)`}else{c3d.style.transform=`rotateY(180deg) rotateX(${rotX}deg) rotateZ(${rotZ}deg)`}c3d.style.transition='transform 0.08s ease';if(sprite)sprite.style.transform=`translate(${-dx*6}px,${-dy*6}px)`;if(sheen&&isSel){sheen.style.opacity='1';sheen.style.background=`radial-gradient(circle at ${50+dx*30}% ${50+dy*30}%, rgba(255,255,255,0.18) 0%, rgba(100,220,255,0.12) 25%, rgba(255,100,220,0.08) 50%, rgba(100,255,180,0.05) 70%, transparent 85%)`}}
function resetTilt(i){const c3d=document.getElementById('c3d-'+i),sheen=document.getElementById('sheen-'+i),sprite=document.getElementById('sprite-'+i);if(!c3d)return;c3d.style.transition='transform 0.4s cubic-bezier(0.34,1.2,0.64,1)';c3d.style.transform='rotateY(180deg)';if(sheen)sheen.style.opacity='0';if(sprite){sprite.style.transition='transform 0.4s ease';sprite.style.transform=''}}

// ═══════════════════════════════════════
// SELECT & HUD
// ═══════════════════════════════════════
function toggleSelect(i) {
  if (hand[i].age >= hand[i].stamina) return; // can't select exhausted
  const idx = selected.indexOf(i);
  const wrap = document.getElementById('card-' + i);
  const mid = (hand.length - 1) / 2;
  const rot = (i - mid) * 3.5;
  const lift = Math.abs(i - mid) * 4;

  if (idx >= 0) {
    sfx('deselect'); selected.splice(idx, 1);
    if (wrap) {
      wrap.classList.remove('selected');
      wrap.style.bottom = (-lift + 20) + 'px';
      wrap.style.transform = `rotate(${rot}deg)`;
      wrap.style.zIndex = 60;
      const face = wrap.querySelector('.card-face');
      if (face) face.classList.remove('sel-glow');
      const sheen = document.getElementById('sheen-' + i);
      if (sheen) sheen.style.opacity = '0';
    }
  } else {
    if (selected.length >= 3) { sfx('denied'); toast('MAX 3 PLAYERS!', 'foul'); return; }
    sfx('select'); selected.push(i);
    if (wrap) {
      spawnPixels(wrap);
      wrap.classList.add('selected');
      wrap.style.bottom = '170px';
      wrap.style.transform = 'rotate(0deg)';
      wrap.style.zIndex = '80';
      const face = wrap.querySelector('.card-face');
      if (face) face.classList.add('sel-glow');
    }
  }
  updateHUD();
}

function flickerHud(id){const el=document.getElementById(id);if(!el)return;el.classList.remove('flicker');void el.offsetWidth;el.classList.add('flicker');setTimeout(()=>el.classList.remove('flicker'),400)}

function updateHUD(){
  document.getElementById('hud-round').textContent=round;
  document.getElementById('hud-score').textContent=score;
  document.getElementById('hud-target').textContent=target;
  document.getElementById('hud-momentum').textContent=momentum;
  document.getElementById('hud-sel').textContent=selected.length+'/3';
  document.getElementById('btn-play').disabled=selected.length===0;
  document.getElementById('btn-draw').disabled=momentum<DRAW_COST;
  document.getElementById('btn-draw').textContent='DRAW ['+DRAW_COST+']';
  for(let s=0;s<3;s++){
    const slot=document.getElementById('tslot-'+s);
    const wasEmpty=!slot.classList.contains('filled');
    const ci=selected[s];
    if(ci!==undefined){slot.textContent=hand[ci].name.first.slice(0,1)+hand[ci].name.last.slice(0,1);slot.classList.add('filled');if(wasEmpty){slot.classList.add('activating');slot.addEventListener('animationend',()=>slot.classList.remove('activating'),{once:true})}}
    else{slot.textContent='_';slot.classList.remove('filled')}
  }
}

// ═══════════════════════════════════════
// DRAW CARD (spend momentum)
// ═══════════════════════════════════════
function drawCard() {
  if (momentum < DRAW_COST) { sfx('denied'); return; }
  // Find unselected, non-exhausted cards to replace
  const replaceable = hand.map((c,i) => ({c,i})).filter(({c,i}) => !selected.includes(i) && c.age < c.stamina);
  if (replaceable.length === 0) { sfx('denied'); toast('NO CARDS TO REPLACE!', 'foul'); return; }

  sfx('draw');
  momentum -= DRAW_COST;

  // Replace the oldest unselected card
  replaceable.sort((a,b) => b.c.age - a.c.age);
  const replaceIdx = replaceable[0].i;
  hand[replaceIdx] = generateCard();

  toast('+1 FRESH CARD', 'momentum');
  flickerHud('hud-momentum');
  renderHand(false);
  updateHUD();
}

// ═══════════════════════════════════════
// RUN PLAY — STAT-DRIVEN MECHANICS
// ═══════════════════════════════════════
function runPlay(){
  if(!selected.length) return;
  sfx('play');
  selected.forEach(i=>{const wrap=document.getElementById('card-'+i);if(wrap)wrap.classList.add('flying-out')});
  const cards = selected.map(i => hand[i]);

  // ── G (Grip) → Raw Tonnage ──
  const gripAvg = cards.reduce((s,c) => s + c.stats['G'], 0) / cards.length;

  // ── B (Balance) → Reduces foul chance ──
  const balAvg = cards.reduce((s,c) => s + c.stats['B'], 0) / cards.length;
  const baseFoulChance = 0.30; // 30% base
  const foulChance = Math.max(0.02, baseFoulChance * (1 - balAvg / 120)); // high B drastically lowers it

  // ── A (Alignment) → Chance to block a foul ──
  const alignAvg = cards.reduce((s,c) => s + c.stats['A'], 0) / cards.length;
  const blockChance = alignAvg / 150; // up to ~66% block at max alignment

  // ── H (Humor) → Momentum generation ──
  const humorAvg = cards.reduce((s,c) => s + c.stats['H'], 0) / cards.length;
  const momentumGain = Math.floor(humorAvg / 15) + 1; // 1-7 per play

  // ── Formation bonuses ──
  const types = cards.map(c => c.type);
  const allSame = types.every(t => t === types[0]) && cards.length === 3;
  const hasGolem = types.includes('golem'), hasToad = types.includes('toad');
  let mult = 1, bonus = '';
  if (allSame) { mult = 1.5; bonus = 'FULL FORMATION X1.5'; }
  else if (hasGolem) { mult = 1.2; bonus = 'GOLEM ANCHOR X1.2'; }
  else if (hasToad) { mult = 1.1; bonus = 'TOAD CLAUSE X1.1'; }

  setTimeout(() => {
    let foulTriggered = Math.random() < foulChance;
    let foulBlocked = foulTriggered && Math.random() < blockChance;

    if (foulTriggered && !foulBlocked) {
      // Foul goes through
      sfx('foul');
      triggerFoul(['DUST OBSCURITY','DEEP-SITE PENALTY','MANUAL CONTACT'][Math.floor(Math.random()*3)]);
      score = Math.max(0, score - 5);
    } else {
      if (foulBlocked) {
        toast('FOUL BLOCKED BY ALIGNMENT!', 'good');
      }
      // Score using Grip
      const gained = Math.round((gripAvg / 100) * 18 * mult * cards.length);
      score += gained;
      showPop('+' + gained + ' TONNAGE' + (bonus ? '\n' + bonus : ''));
      if (bonus) toast(bonus, 'good');
    }

    // Momentum from Humor (always gained, even on foul)
    momentum += momentumGain;
    if (momentumGain > 0) {
      setTimeout(() => toast('+' + momentumGain + ' MOMENTUM', 'momentum'), foulTriggered ? 800 : 400);
    }

    flickerHud('hud-score');
    flickerHud('hud-momentum');

    // ── M (Metabolism) → Age unplayed cards ──
    const playedIndices = new Set(selected);
    hand.forEach((card, i) => {
      if (!playedIndices.has(i)) {
        card.age++;
      }
    });

    // Remove played cards, replace with fresh
    let newHand = hand.filter((_, i) => !selected.includes(i));

    // Auto-replace exhausted cards with fresh draws
    let exhaustedCount = 0;
    newHand = newHand.map(card => {
      if (card.age >= card.stamina) {
        exhaustedCount++;
        return generateCard(); // replaced
      }
      return card;
    });

    // Fill back to 7
    while (newHand.length < 7) newHand.push(generateCard());
    hand = newHand;
    selected = [];

    if (exhaustedCount > 0) {
      setTimeout(() => {
        sfx('exhaust');
        toast(exhaustedCount + ' CARD' + (exhaustedCount > 1 ? 'S' : '') + ' EXHAUSTED — REPLACED!', 'foul');
      }, 600);
    }

    if (score >= target) {
      setTimeout(nextRound, 500);
    } else {
      renderHand(true);
      updateHUD();
    }
  }, 480);
}

function nextRound(){round++;target=Math.round(target*1.6);flickerHud('hud-round');flickerHud('hud-target');toast('ROUND '+round+'  TARGET: '+target,'good');document.getElementById('hud-round').textContent=round;document.getElementById('hud-target').textContent=target;dealHand()}

function showPop(txt){const el=document.getElementById('score-popup');el.textContent=txt;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function triggerFoul(name){const f=document.getElementById('foul-flash');f.classList.remove('flash');void f.offsetWidth;f.classList.add('flash');showPop('FOUL!\n'+name);toast('FOUL: '+name+'  -5','foul')}
let toastTimer;
function toast(msg,type){const el=document.getElementById('toast');el.textContent=msg;el.className='show'+(type?' '+type:'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='',3000)}
function spawnPixels(el){if(!el)return;const rect=el.getBoundingClientRect();const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;const colors=['#f8d800','#e40058','#4a90d9','#58d854','#bc84fc','#00e8d8'];for(let i=0;i<14;i++){const p=document.createElement('div');p.className='particle';const sz=4+Math.floor(Math.random()*5);const angle=Math.random()*Math.PI*2;const dist=35+Math.random()*55;p.style.cssText=`width:${sz}px;height:${sz}px;left:${cx}px;top:${cy}px;background:${colors[Math.floor(Math.random()*colors.length)]};--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;animation-delay:${Math.random()*0.08}s;`;document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}}
