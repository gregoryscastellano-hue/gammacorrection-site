<!DOCTYPE html>
<html>
<head>
  <title>~ GAMMA CORRECTION ~</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    /* --- THE BONZI ANOMALY --- */
    #bonzi-surfer {
      position: fixed;
      top: -300px;
      left: -300px;
      width: 180px;
      z-index: 10000;
      pointer-events: none;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 15px #aa00ff);
      will-change: transform, top;
    }

    /* flipped = FACE RIGHT */
    #bonzi-surfer.flipped {
      transform: scaleX(-1);
    }

    @keyframes flyRight {
      from { transform: translate(-200px, 100vh) rotate(15deg); }
      to   { transform: translate(120vw, -300px) rotate(-15deg); }
    }

    @keyframes flyLeft {
      from { transform: translate(110vw, 100vh) rotate(-15deg); }
      to   { transform: translate(-300px, -300px) rotate(15deg); }
    }

    body {
      background-image: url('https://64.media.tumblr.com/d9573aea3bf4d7386b42ddd516ea1ce6/147bfebdf112f180-78/s250x400/6895a383d6d2b83a717218a904480bd772fcc875.gif');
      background-repeat: repeat;
      background-attachment: fixed;
      color: #ffffff;
      font-family: "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding-top: 20px;
      overflow-x: hidden;
    }

    h1 {
      font-family: "Comic Sans MS", cursive;
      font-size: 42px;
      color: #00FF00;
      text-shadow: 3px 3px #ff00ff;
      margin: 10px 0;
      background: rgba(0, 0, 0, 0.8);
      padding: 5px 20px;
      border: 2px double #00FF00;
    }

    .station-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 30px 0;
      width: 100%;
      flex-wrap: nowrap;
    }

    /* SINGLE green border lives HERE */
    .creator-station {
      border: 2px double #00FF00;
      padding: 5px;
      background-color: #000;
    }

    /* NO border here anymore */
    .creator-station img {
      height: 100px;
      width: auto;
      cursor: pointer;
    }

    .netscape-player-small {
      background: #000;
      border: 2px solid #777;
      padding: 5px;
      width: 140px;
      text-align: center;
      image-rendering: pixelated;
      font-family: 'VT323', monospace;
    }

    .player-header-small { border-bottom: 1px solid #444; margin-bottom: 5px; }
    .gold-text-small { color: #d4af37; font-size: 14px; letter-spacing: 1px; }

    .visualizer-small {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 1px;
      height: 30px;
      background: #111;
      margin-bottom: 5px;
      border: 1px inset #555;
    }

    .v-bar { width: 10px; height: 30%; transition: height 0.1s; }
    .v-red { background: #ff0000; }
    .v-orange { background: #ff7700; }
    .v-yellow { background: #ffff00; }
    .v-green { background: #00ff00; }
    .v-blue { background: #0000ff; }

    @keyframes barJump {
      0% { height: 30%; }
      50% { height: 100%; }
      100% { height: 30%; }
    }

    .visualizing { animation: barJump 0.5s infinite alternate; }

    .win95-btn-small {
      background: #c0c0c0;
      border: 2px outset #fff;
      width: 30px;
      height: 20px;
      cursor: pointer;
      font-size: 10px;
    }
    .win95-btn-small:active { border: 2px inset #fff; }
  </style>
</head>

<body>

  <img
    id="bonzi-surfer"
    src="https://i.redd.it/do-you-guys-ever-realize-v0-6gk197n3r6kc1.png?width=200&format=png&auto=webp&s=4534d6d26bfb45fe6c76f636b500d33a0f2b8349"
    alt="Surfing Anomaly"
  >

  <h1>gamma correction</h1>

  <div class="station-container">
    <div class="creator-station">
      <img
        id="archivist-img"
        src="https://web.archive.org/web/20091027110940/http://geocities.com/le_graphics/clipart/animated/computer-type.gif"
        onclick="handleComputerClick()"
        alt="Gamma Correction Station"
      >
    </div>

    <div class="netscape-player-small">
      <div class="player-header-small"><span class="gold-text-small">◀ SOUND ▶</span></div>
      <div class="visualizer-small">
        <div class="v-bar v-red"></div>
        <div class="v-bar v-orange"></div>
        <div class="v-bar v-yellow"></div>
        <div class="v-bar v-green"></div>
        <div class="v-bar v-blue"></div>
      </div>
      <div class="control-deck-small">
        <button class="win95-btn-small" onclick="stopAudio()">■</button>
        <button class="win95-btn-small" onclick="playAudio()">▶</button>
        <button class="win95-btn-small" onclick="pauseAudio()">II</button>
      </div>
      <audio id="main-theme" loop>
        <source src="Pilotredsun- Fat Cat.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <script>
    // ----- BONZI -----
    const bonzi = document.getElementById("bonzi-surfer");

    function summonBonzi() {
      const goingLeft = Math.random() < 0.5;

      bonzi.style.top = Math.floor(Math.random() * 70 + 10) + "%";

      /* FIX: flip only when going RIGHT */
      bonzi.classList.toggle("flipped", !goingLeft);

      bonzi.style.animation = "none";
      bonzi.offsetHeight;

      bonzi.style.animation = goingLeft
        ? "flyLeft 8s linear forwards"
        : "flyRight 8s linear forwards";
    }

    bonzi.addEventListener("animationend", () => {
      bonzi.style.animation = "none";
      setTimeout(summonBonzi, Math.random() * (90000 - 50000) + 50000);
    });

    setTimeout(summonBonzi, 30000);

    // ----- AUDIO -----
    const fatCat = document.getElementById("main-theme");
    const bars = document.querySelectorAll(".v-bar");

    function playAudio() {
      fatCat.play().catch(() => {});
      bars.forEach(bar => bar.classList.add("visualizing"));
    }
    function pauseAudio() {
      fatCat.pause();
      bars.forEach(bar => bar.classList.remove("visualizing"));
    }
    function stopAudio() {
      fatCat.pause();
      fatCat.currentTime = 0;
      bars.forEach(bar => bar.classList.remove("visualizing"));
    }

    function handleComputerClick() {
      alert("computer clicked");
    }
  </script>

</body>
</html>
