<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>GammaCorrection | The Garbage Ape Protocol</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .interface { border: 2px solid #0f0; padding: 40px; text-align: center; background: rgba(0, 20, 0, 0.9); box-shadow: 0 0 20px #0f0; width: 400px; }
        h1 { font-size: 1.2rem; letter-spacing: 4px; border-bottom: 1px solid #0f0; padding-bottom: 10px; }
        input { background: transparent; border: 1px solid #0f0; color: #0f0; padding: 10px; width: 80%; margin: 20px 0; outline: none; text-align: center; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; }
        button:hover { background: #ffcc00; }
        #timer { color: #ffcc00; font-size: 0.8rem; margin-top: 20px; border: 1px dashed #ffcc00; padding: 10px; }
        .status-msg { font-size: 0.7rem; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="interface">
        <h1>GAMMA CORRECTION</h1>
        <p>RE-CALIBRATING ARCHIVES...</p>
        <input type="text" id="intent" placeholder="ENTER LEGISLATIVE INTENT..." autocomplete="off">
        <button onclick="seekSlack()">ACTIVATE ORACLE</button>
        
        <div id="timer">SABBATH INITIATING...</div>
        <div class="status-msg">BYPASSING PINK PAYWALLS...</div>
    </div>

    <script>
        function seekSlack() {
            const input = document.getElementById('intent').value;
            if (!input) return;

            // 1 in 17,500 chance for the HEATHCLIFF EVENT
            const roll = Math.floor(Math.random() * 17500) + 1;
            
            if (roll === 777) {
                // Heathcliff Black Swan - Direct Link
                window.location.href = "https://assets.amuniversal.com/6c76e22067d90132b6a4005056a9545d";
            } else {
                // Garfield Archive - Generating Date
                const start = new Date(1978, 5, 19);
                const end = new Date();
                const randomDate = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
                
                const y = randomDate.getFullYear();
                const m = String(randomDate.getMonth() + 1).padStart(2, '0');
                const d = String(randomDate.getDate()).padStart(2, '0');
                
                // We use a redirect service that strips the Paywall headers
                // This targets the GoComics redirector which often bypasses the splash page
                window.location.href = `https://www.gocomics.com/garfield/${y}/${m}/${d}`;
            }
        }

        function updateTimer() {
            const now = new Date();
            const nextMonday = new Date();
            nextMonday.setDate(now.getDate() + (1 + 7 - now.getDay()) % 7);
            nextMonday.setHours(0, 0, 0, 0);
            
            const diff = nextMonday - now;
            const hours = Math.floor(diff / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            document.getElementById('timer').innerText = `MONDAY SABBATH IN: ${hours}h ${mins}m`;
        }
        setInterval(updateTimer, 60000);
        updateTimer();
    </script>
</body>
</html>
