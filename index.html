<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>GammaCorrection | The Wizard Oracle</title>
    <style>
        body { 
            background-color: #000; 
            color: #ffaa00; /* Wizard Gold */
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        .shrine { 
            text-align: center; 
            z-index: 2;
        }
        .wizard-img {
            width: 300px; /* Adjust size as needed */
            filter: drop-shadow(0 0 20px #ffaa00);
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.5s;
        }
        .wizard-img:hover {
            transform: scale(1.05) rotate(2deg);
        }
        h1 { font-size: 1.5rem; letter-spacing: 10px; color: #ffaa00; text-shadow: 0 0 10px #ffaa00; }
        input { 
            background: #111; 
            border: 1px solid #ffaa00; 
            color: #ffaa00; 
            padding: 12px; 
            width: 300px; 
            margin-bottom: 20px; 
            outline: none;
            text-align: center;
            box-shadow: 0 0 10px #330000;
        }
        button { 
            background: #ffaa00; 
            color: #000; 
            border: none; 
            padding: 12px 30px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        button:hover { background: #fff; box-shadow: 0 0 20px #ffaa00; }
        #monday-timer { 
            color: #ff4444; 
            font-size: 0.9rem; 
            margin-top: 30px; 
            letter-spacing: 2px;
            font-weight: bold;
        }
        .status { font-size: 0.7rem; color: #555; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="shrine">
        <h1>THE ORACLE</h1>
        
        <img src="https://i.ebayimg.com/images/g/H04AAOSw~hRmdfUo/s-l1600.webp" 
             alt="Wizard Garfield" 
             class="wizard-img" 
             onclick="speak()">

        <p>COMMUNE WITH THE ARCH-MAGE OF SLACK</p>
        
        <input type="text" id="intent" placeholder="WHISPER YOUR INTENT..." autocomplete="off"><br>
        
        <button onclick="seekSlack()">CONSULT THE ARCANA</button>
        
        <div id="monday-timer">MONDAY ARRIVES IN: --:--:--</div>
        <div class="status">BYPASSING PINK WARDS...</div>
    </div>

    <script>
        function speak() {
            alert("The Wizard demands Lasagna before he reveals the future.");
        }

        function seekSlack() {
            const input = document.getElementById('intent').value.trim();
            if (!input) return;

            const roll = Math.floor(Math.random() * 17500) + 1;
            let targetUrl = "";

            // The Heathcliff Event / The High Roller Command
            if (roll === 777 || input.toUpperCase() === "BOB" || input.toUpperCase() === "HEATHCLIFF") {
                targetUrl = "https://www.gocomics.com/heathcliff/2026/02/01";
            } else {
                const start = new Date(1978, 5, 19);
                const end = new Date();
                const randomDate = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
                targetUrl = `https://www.gocomics.com/garfield/${randomDate.getFullYear()}/${String(randomDate.getMonth() + 1).padStart(2, '0')}/${String(randomDate.getDate()).padStart(2, '0')}`;
            }

            // THE STEALTH PORTAL
            // This redirects through a search proxy to fool the GoComics Paywall scripts
            const bypassUrl = "https://href.li/?https://www.google.com/search?q=" + encodeURIComponent(targetUrl) + "&btnI=I";
            
            const a = document.createElement('a');
            a.href = bypassUrl;
            a.rel = 'noreferrer';
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function updateMondayTimer() {
            const now = new Date();
            const nextMonday = new Date();
            // Calculate days until next Monday (1)
            nextMonday.setDate(now.getDate() + (1 + 7 - now.getDay()) % 7 || 7);
            nextMonday.setHours(0, 0, 0, 0);
            
            const diff = nextMonday - now;
            const hours = Math.floor(diff / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            const secs = Math.floor((diff % 60000) / 1000);
            
            document.getElementById('monday-timer').innerText = `MONDAY ARRIVES IN: ${hours}h ${mins}m ${secs}s`;
        }
        
        setInterval(updateMondayTimer, 1000);
        updateMondayTimer();
    </script>
</body>
</html>
