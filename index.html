<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GammaCorrection | The Oracle of Slack</title>
    <style>
        body { background-color: #002200; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding: 50px; }
        .terminal { border: 2px solid #00ff00; padding: 30px; display: inline-block; background-color: #001100; box-shadow: 0 0 15px #00ff00; }
        h1 { text-transform: uppercase; letter-spacing: 8px; color: #00ff00; }
        input { background: transparent; border: 1px solid #00ff00; color: #00ff00; padding: 10px; width: 80%; margin-bottom: 20px; outline: none; }
        button { background-color: #00ff00; color: #002200; padding: 15px 30px; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background-color: #ffcc00; }
        .status { font-size: 0.8em; margin-top: 20px; color: #008800; }
    </style>
</head>
<body>

    <div class="terminal">
        <h1>GARBAGE APE INTERFACE</h1>
        <p>RE-CALIBRATING REALITY VIA GAMMA CORRECTION...</p>
        
        <input type="text" id="billName" placeholder="ENTER BILL OR QUESTION..." autocomplete="off"><br>
        
        <button onclick="seekSlack()">CONSULT THE ORACLE</button>

        <div class="status" id="log">SYSTEM READY. AWAITING SLACK...</div>
    </div>

    <script>
        function seekSlack() {
            const bill = document.getElementById('billName').value;
            if (!bill) { alert("THE ORACLE REQUIRES INPUT."); return; }

            document.getElementById('log').innerText = "CALCULATING PROBABILITY OF LASAGNA...";

            // THE HEATHCLIFF VARIABLE: 1 in 17,500 chance
            const roll = Math.floor(Math.random() * 17500) + 1;
            
            setTimeout(() => {
                if (roll === 777) {
                    // THE HEATHCLIFF EVENT (A random date for Heathcliff)
                    window.location.href = "https://www.gocomics.com/heathcliff/2026/02/01";
                } else {
                    // THE GARFIELD LOGIC
                    const start = new Date(1978, 5, 19); // June is index 5
                    const end = new Date();
                    const randomDate = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
                    
                    const y = randomDate.getFullYear();
                    const m = String(randomDate.getMonth() + 1).padStart(2, '0');
                    const d = String(randomDate.getDate()).padStart(2, '0');
                    
                    window.location.href = `https://www.gocomics.com/garfield/${y}/${m}/${d}`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
