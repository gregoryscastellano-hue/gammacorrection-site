<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GammaCorrection | The Wizard Oracle</title>
<style>
  body { 
    background-color: #000; color: #ffaa00; font-family: 'Courier New', monospace; 
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    min-height: 100vh; margin: 0; overflow: hidden; text-align: center;
  }
  .shrine { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px; }
  .wizard-img {
    width: 350px; max-width: 80vw; filter: drop-shadow(0 0 15px #ffaa00);
    margin: 20px 0; cursor: pointer; animation: pulse 4s infinite ease-in-out;
  }
  @keyframes pulse {
    0% { transform: scale(1); filter: drop-shadow(0 0 15px #ffaa00); }
    50% { transform: scale(1.03); filter: drop-shadow(0 0 30px #ffcc00); }
    100% { transform: scale(1); filter: drop-shadow(0 0 15px #ffaa00); }
  }
  h1 { font-size: 1.8rem; letter-spacing: 12px; text-shadow: 0 0 10px #ffaa00; margin: 0; }
  input { 
    background: #000; border: 1px solid #ffaa00; color: #ffaa00; 
    padding: 12px; width: 300px; margin-bottom: 15px; outline: none; text-align: center;
  }
  button { 
    background: #ffaa00; color: #000; border: none; padding: 12px 30px; 
    font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 3px;
  }
  #monday-timer { color: #ff4444; font-size: 1rem; margin-top: 40px; border-top: 1px double #333; padding-top: 20px; width: 100%; }
</style>
</head>
<body>
<div class="shrine">
  <h1>THE ORACLE</h1>
  <img src="https://i0.wp.com/www.pinnyshop.com/wp-content/uploads/2024/04/west17-garfield.png?fit=800%2C800&ssl=1" alt="The Wizard" class="wizard-img">
  <input type="text" id="intent" placeholder="WHISPER YOUR INTENT..." autocomplete="off">
  <button onclick="seekSlack()">CONSULT THE ARCANA</button>
  <div id="monday-timer">MONDAY ARRIVES IN: --:--:--</div>
</div>

<script>
function seekSlack() {
  const input = document.getElementById('intent');
  
  // The Oracle consumes the text visually
  input.value = ""; 

  // 1. Generate Random Date within the "Safe Zone"
  // Start: June 19, 1978
  // End: Dec 31, 2012 (Reliable "ucomics" file naming era)
  const start = new Date(1978, 5, 19); 
  const end = new Date(2012, 11, 31);
  const randomDate = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
  
  // 2. Format the Date for the Legacy Filename
  const fullYear = randomDate.getFullYear();
  const yy = String(fullYear).slice(-2); // Last 2 digits of year
  const mm = String(randomDate.getMonth() + 1).padStart(2, '0');
  const dd = String(randomDate.getDate()).padStart(2, '0');

  // 3. Construct the Deep Archive URL
  // "id_" in the archive URL forces the raw image display (no archive toolbar)
  const filename = `ga${yy}${mm}${dd}.gif`;
  const legacyUrl = `http://images.ucomics.com/comics/ga/${fullYear}/${filename}`;
  const finalUrl = `https://web.archive.org/web/20180201000000id_/${legacyUrl}`;

  // 4. Open
  window.open(finalUrl, "_blank");
}

function updateMondayTimer() {
  const now = new Date();
  const nextMonday = new Date();
  nextMonday.setDate(now.getDate() + (1 + 7 - now.getDay()) % 7 || 7);
  nextMonday.setHours(0, 0, 0, 0);
  const diff = nextMonday - now;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('monday-timer').innerText = `MONDAY ARRIVES IN: ${h}h ${m}m ${s}s`;
}
setInterval(updateMondayTimer, 1000);
updateMondayTimer();
</script>
</body>
</html>
