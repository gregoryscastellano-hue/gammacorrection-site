<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>GammaCorrection | The Garbage Ape Protocol</title>
    <style>
        body { 
            background-color: #000; 
            color: #0f0; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        .interface { 
            border: 2px solid #0f0; 
            padding: 40px; 
            text-align: center; 
            background: rgba(0, 15, 0, 0.95);
            box-shadow: 0 0 30px #0f0;
            width: 450px;
            position: relative;
        }
        h1 { font-size: 1.4rem; letter-spacing: 5px; border-bottom: 1px solid #0f0; padding-bottom: 10px; margin-top: 0; }
        p { font-size: 0.9rem; margin-bottom: 20px; }
        input { 
            background: transparent; 
            border: 1px solid #0f0; 
            color: #0f0; 
            padding: 12px; 
            width: 85%; 
            margin-bottom: 20px; 
            outline: none;
            text-align: center;
            font-size: 1rem;
        }
        button { 
            background: #0f0; 
            color: #000; 
            border: none; 
            padding: 12px 25px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button:hover { background: #ffcc00; }
        #timer { 
            color: #ffcc00; 
            font-size: 0.8rem; 
            margin-top: 25px; 
            border: 1px dashed #ffcc00; 
            padding: 10px;
            background: rgba(40, 30, 0, 0.3);
        }
        .footer-msg { font-size: 0.6rem; color: #006600; margin-top: 15px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="interface">
        <h1>GAMMA CORRECTION</h1>
        <p>DEEP STATE ORACLE V3.0 [SECURE]</p>
        
        <input type="text" id="intent" placeholder="ENTER LEGISLATIVE INTENT..." autocomplete="off">
        
        <button onclick="seekSlack()">CONSULT THE CAT</button>
        
        <div id="timer">SABBATH COUNTDOWN: INITIALIZING...</div>
        
        <div class="footer-msg">
            By order of the Garbage Ape Government. All rights reserved.
        </div>
    </div>

    <script>
        function seekSlack() {
            const input = document.getElementById('intent').value.trim().toUpperCase();
            if (!input) {
                alert("THE ORACLE REQUIRES INTENT.");
                return;
            }

            // --- THE ORACLE LOGIC ---
            const roll = Math.floor(Math.random() * 17500) + 1;
            let targetUrl = "";

            // SECRET COMMANDS
            if (input === "HEATHCLIFF" || input === "BOB" || input === "GARBAGE APE" || roll === 777) {
                // THE BLACK SWAN PROTOCOL
                targetUrl = "https://www.gocomics.com/heathcliff/2026/02/01";
            } else {
                // THE GARFIELD ARCHIVE (45+ YEARS)
                const start = new Date(1978, 5, 19);
                const end = new Date();
                const randomDate = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
                
                const y = randomDate.getFullYear();
                const m = String(randomDate.getMonth() + 1).padStart(2, '0');
                const d = String(randomDate.getDate()).padStart(2, '0');
                
                targetUrl = `https://www.gocomics.com/garfield/${y}/${m}/${d}`;
            }

            // --- THE DEEP STATE BYPASS ---
            // 1. We use a Dereferrer to strip 'gammacorrection.com' from the request
            const bypassUrl = "https://href.li/?" + targetUrl;
            
            // 2. We create an invisible "Void Anchor"
            const a = document.createElement('a');
            a.href = bypassUrl;
            a.rel = 'noreferrer'; // HARD SHIELD
            a.target = '_blank';  // RESET SESSION
            document.body.appendChild(a);
            
            // 3. Trigger the portal
            a.click();
            
            // 4. Cleanup the evidence
            document.body.removeChild(a);
        }

        // --- MONDAY SABBATH TIMER ---
        function updateTimer() {
            const now = new Date();
            // Find the next Monday (Day 1)
            const nextMonday = new Date();
            nextMonday.setDate(now.getDate() + (1 + 7 - now.getDay()) % 7);
            nextMonday.setHours(0, 0, 0, 0);
            
            // If it's already Monday, this will count to NEXT Monday.
            // Under Garbage Ape law, the Sabbath is a 24-hour cycle.
            
            const diff = nextMonday - now;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('timer').innerText = `NEXT MONDAY SABBATH IN: ${hours}h ${mins}m ${secs}s`;
        }
        
        // Update every second for that "High-Stakes" Iceberg feel
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
