<!DOCTYPE html>
<html>
<head>
    <title>~ GAMMA CORRECTION ~</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-image: url('https://64.media.tumblr.com/d9573aea3bf4d7386b42ddd516ea1ce6/147bfebdf112f180-78/s250x400/6895a383d6d2b83a717218a904480bd772fcc875.gif');
            background-repeat: repeat;
            background-attachment: fixed;
            color: #ffffff;
            font-family: "Courier New", monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 20px;
            overflow-x: hidden;
        }

        h1 {
            font-family: "Comic Sans MS", cursive;
            font-size: 42px;
            color: #00FF00;
            text-shadow: 3px 3px #ff00ff;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 20px;
            border: 2px double #00FF00;
        }

        /* --- THE CREATOR STATION (GIF + PLAYER) --- */
        .station-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; 
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .creator-station {
            border: 2px double #00FF00;
            padding: 5px;
            background-color: #000;
        }

        .creator-station img { height: 100px; width: auto; }

        .netscape-player-small {
            background: #000;
            border: 2px solid #777;
            padding: 5px;
            width: 140px; 
            text-align: center;
            image-rendering: pixelated;
            font-family: 'VT323', monospace;
        }

        .player-header-small { border-bottom: 1px solid #444; margin-bottom: 5px; }
        .gold-text-small { color: #d4af37; font-size: 14px; letter-spacing: 1px; }

        .visualizer-small {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 1px;
            height: 30px;
            background: #111;
            margin-bottom: 5px;
            border: 1px inset #555;
        }

        .v-bar { width: 10px; height: 30%; } /* Default height */
        .v-red { background: #ff0000; }
        .v-orange { background: #ff7700; }
        .v-yellow { background: #ffff00; }
        .v-green { background: #00ff00; }
        .v-blue { background: #0000ff; }

        /* --- VISUALIZER ANIMATION CODE --- */
        @keyframes barJump {
            0% { height: 30%; }
            50% { height: 100%; }
            100% { height: 30%; }
        }

        .visualizing {
            animation: barJump 0.5s infinite alternate;
        }

        .v-bar:nth-child(1) { animation-duration: 0.4s; }
        .v-bar:nth-child(2) { animation-duration: 0.7s; }
        .v-bar:nth-child(3) { animation-duration: 0.5s; }
        .v-bar:nth-child(4) { animation-duration: 0.9s; }
        .v-bar:nth-child(5) { animation-duration: 0.6s; }

        .win95-btn-small {
            background: #c0c0c0;
            border: 2px outset #fff;
            width: 30px;
            height: 20px;
            cursor: pointer;
            font-size: 10px;
        }
        .win95-btn-small:active { border: 2px inset #fff; }

        /* --- THE WINDOW & BADGES --- */
        .window {
            background: #c0c0c0;
            border: 3px outset #ffffff;
            width: 85%;
            max-width: 600px;
            box-shadow: 6px 6px 0px #000000;
            margin-bottom: 20px;
        }
        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 2px 8px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        .content {
            background: #ffffff;
            color: #000000;
            padding: 15px;
            border: 2px inset #808080;
            margin: 4px;
            line-height: 1.4;
            font-size: 14px;
        }
        .badge-bar img { height: 35px; margin: 0 3px; }

        /* --- PORTALS --- */
        .portal { position: absolute; text-align: center; width: 120px; }
        .portal-text {
            font-family: 'Comic Sans MS';
            font-size: 12px;
            margin-bottom: 5px;
            background: rgba(0,0,0,0.7);
            padding: 2px;
        }
        #portal-monkey { right: 5%; top: 25%; }
        #portal-reticulated { left: 5%; top: 20%; }
        #portal-tribbleton { right: 10%; bottom: 15%; }
    </style>
</head>
<body>

    <h1>gamma correction</h1>

    <div class="station-container">
        <div class="creator-station">
            <img src="https://web.archive.org/web/20091027110940/http://geocities.com/le_graphics/clipart/animated/computer-type.gif">
        </div>

        <div class="netscape-player-small">
            <div class="player-header-small"><span class="gold-text-small">◀ SOUND ▶</span></div>
            <div class="visualizer-small">
                <div class="v-bar v-red"></div>
                <div class="v-bar v-orange"></div>
                <div class="v-bar v-yellow"></div>
                <div class="v-bar v-green"></div>
